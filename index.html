<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0708">
<title>경계의 문 - 붉은 토끼의 회중시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Song+Myung&family=Pinyon+Script&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0708; --bg2:#1a0b0e; --ink:#eadfcd; --mute:#a8998a; --gold:#c9a45c; --gold2:#e6c98a;
  --red:#b31b2b; --red2:#e0414f; --panel:rgba(14,11,9,.82); --line:rgba(201,164,92,.35);
  --accent:#c9a45c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#070606}
body{
  min-height:100vh; color:var(--ink); font-family:'Noto Serif KR',serif; font-size:16px; line-height:1.85;
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(201,164,92,.16) 0%, rgba(201,164,92,0) 55%),
    radial-gradient(90% 60% at 50% 110%, rgba(120,20,30,.22) 0%, rgba(120,20,30,0) 70%),
    linear-gradient(180deg,#0e0b09 0%, #070606 100%);
  background-attachment:fixed; overflow-x:hidden;
}
body::after{ /* vignette */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
}
#fx{position:fixed; inset:0; z-index:0; pointer-events:none}
.fog{position:fixed; width:140vw; height:60vh; left:-20vw; pointer-events:none; z-index:0; filter:blur(40px); opacity:.18;
  background:radial-gradient(closest-side, rgba(200,190,190,.55), rgba(200,190,190,0)); animation:drift 38s ease-in-out infinite alternate}
.fog.f1{top:55vh} .fog.f2{top:10vh; animation-duration:52s; opacity:.1; animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-8vw)} to{transform:translateX(8vw)}}

/* spider */
.spider{position:absolute; top:-6px; left:calc(50% + 44px); z-index:6; width:34px; pointer-events:none; cursor:pointer; transform:translateY(-150px); transition:transform 3.2s cubic-bezier(.4,.1,.3,1)}
.spider .thread{position:absolute; left:16px; bottom:30px; width:1px; height:200px; background:linear-gradient(rgba(220,220,220,.0),rgba(220,220,220,.5))}
.spider svg{display:block; pointer-events:auto; padding:6px; margin:-6px; box-sizing:content-box}
.spider-story p{text-align:left; font-size:15px; color:var(--ink); line-height:1.9} .spider-story{max-height:70vh; overflow:auto}
.spider.down{transform:translateY(34px)}
header{position:relative}
.market{margin-top:6px}
.market .slots{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:14px}
.slot{min-width:0; overflow-wrap:anywhere; word-break:normal; padding:12px 12px 10px; border:1px solid rgba(201,164,92,.3); border-radius:6px; background:rgba(0,0,0,.25)}
.slot h4{margin:0 0 2px; font-family:'Noto Serif KR',serif; font-size:14.5px; color:var(--gold2)}
.slot .answer{margin-top:8px}
.slot .memo{margin-top:8px; padding:10px 12px; border-left:2px solid var(--red2); background:rgba(179,27,43,.08); font-size:15px}
.slot .memo b{display:block; color:var(--red2); font-size:13px; margin-bottom:4px}

main{position:relative; z-index:2; max-width:560px; margin:0 auto; padding:18px 16px 40px}
header{text-align:center; padding:14px 0 6px}
.clock{width:92px; height:92px; margin:0 auto 6px; display:block; filter:drop-shadow(0 0 16px rgba(201,164,92,.4))}
.script{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:30px; line-height:1.1; letter-spacing:.5px; text-shadow:0 0 18px rgba(201,164,92,.35)}
.script .red{color:var(--red2)}
.kr-title{font-family:'Song Myung','Noto Serif KR',serif; color:var(--ink); font-size:15px; letter-spacing:6px; margin-top:6px; opacity:.9}
.suits{color:var(--gold); letter-spacing:10px; font-size:13px; margin:6px 0 0; opacity:.8}
.suits .r{color:var(--red2)}

.badge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:2px 10px; margin-top:10px}
.badge b{color:var(--accent); font-weight:700}
.badge button{all:unset; cursor:pointer; color:var(--mute); text-decoration:underline; font-size:11.5px; margin-left:4px}

nav.chapters{display:flex; gap:6px; overflow-x:auto; padding:10px 2px 4px; scrollbar-width:none; margin-top:6px}
nav.chapters::-webkit-scrollbar{display:none}
nav.chapters button{flex:0 0 auto; font-family:inherit; font-size:12.5px; color:var(--mute); background:rgba(255,255,255,.03); border:1px solid rgba(201,164,92,.22); border-radius:999px; padding:5px 12px; cursor:pointer}
nav.chapters button.on{color:#1a0b0e; background:var(--gold); border-color:var(--gold)}

.panel{min-width:0; overflow-wrap:anywhere; position:relative; margin-top:14px; padding:26px 20px 24px; background:var(--panel); border:1px solid var(--line); border-radius:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 60px rgba(120,20,30,.15); backdrop-filter:blur(2px); animation:rise .7s ease both}
.panel::before,.panel::after{content:"♥"; position:absolute; font-size:11px; color:var(--red2); opacity:.7}
.panel::before{top:6px; left:9px} .panel::after{content:"♠"; color:var(--gold); bottom:6px; right:9px}
@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
h2{font-family:'Song Myung','Noto Serif KR',serif; font-weight:400; font-size:22px; color:var(--gold2); margin:0 0 4px; text-align:center; letter-spacing:2px}
.sub{text-align:center; color:var(--mute); font-size:13px; margin:0 0 18px}
p{margin:0 0 12px}
.center{text-align:center}
.big{font-size:18px; line-height:1.9; color:var(--gold2); margin:18px 0}
.poem{margin:6px 0 18px; padding:14px 16px; border-left:2px solid var(--red); background:rgba(179,27,43,.07); font-size:16.5px; line-height:2}
.poem div{white-space:normal}
.letter{margin:6px 0 16px; padding:8px 0; color:#2b1d14; border-radius:2px; box-shadow:0 6px 24px rgba(0,0,0,.5);
  background:radial-gradient(ellipse at 50% 40%, rgba(255,250,235,.55), rgba(0,0,0,0) 70%), radial-gradient(ellipse at 100% 100%, rgba(120,80,30,.22), rgba(0,0,0,0) 45%), radial-gradient(ellipse at 0% 0%, rgba(120,80,30,.18), rgba(0,0,0,0) 40%), linear-gradient(180deg,#efe3c8,#e3d2ae)}
.letter .ln{padding:9px 14px; border-bottom:1px dashed rgba(90,60,30,.35); font-size:15px; line-height:1.7}
.letter .ln:last-child{border-bottom:0}
.letter-note{font-size:12.5px; color:var(--mute); margin:-8px 0 16px; text-align:center}
.record{position:relative; margin:4px 0 20px; padding:16px 16px 14px 18px; border:1px solid rgba(201,164,92,.4); background:rgba(201,164,92,.06); border-radius:4px}
.record .tag{position:absolute; top:-10px; left:12px; background:var(--bg2); padding:0 8px; font-size:12px; color:var(--gold); letter-spacing:2px}
.record p{margin:0; font-size:15.5px}
.suit-rec{margin:0 0 16px; padding:14px 16px; border-radius:4px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07)}
.suit-rec h3{margin:0 0 6px; font-family:'Noto Serif KR',serif; font-size:15px; color:var(--gold2)}
.suit-rec h3 .r{color:var(--red2)}
.stop{margin:20px 0 4px; padding:12px 14px; text-align:center; border:1px solid rgba(224,65,79,.55); color:#f3c9cc; background:rgba(179,27,43,.12); border-radius:4px; font-size:14.5px; animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(224,65,79,.35)}}
.q{display:flex; align-items:flex-start; gap:10px; margin:0 0 12px; padding:12px 14px; border-left:2px solid var(--gold); background:rgba(201,164,92,.06)}
.q b{flex:1; color:var(--gold2); font-weight:700} .q .pt{flex:0 0 auto; font-size:13px; color:var(--red2); font-weight:700; white-space:nowrap; margin-top:2px}
nav.guide{padding-top:8px; margin-top:8px}
nav.guide button{color:var(--gold2); border-color:rgba(201,164,92,.4); background:rgba(201,164,92,.06)}
nav.guide button.on{color:#1a1108; background:var(--gold); border-color:var(--gold)}
.line.guest .who{background:radial-gradient(circle at 35% 30%,#f3e6c6,#b89a5e); color:#b31b2b; box-shadow:0 0 12px rgba(230,201,138,.45); font-size:22px}
.line.guest .bubble{border-color:rgba(230,201,138,.45); border-radius:14px 4px 14px 14px}
.line.guest .bubble .nm{color:var(--gold2)}
.hidden-story{text-align:center; margin-top:26px}
.hs-body{text-align:left; margin-top:6px; padding:18px 16px; border-top:1px solid rgba(201,164,92,.3); animation:fadein 1.6s ease both}
.hs-body h3{font-family:'Noto Serif KR',serif; text-align:center; color:var(--red2); font-size:16px; letter-spacing:3px; margin:0 0 14px}
.hs-body p{font-size:15px; color:#d9cbbb}
.acttag{display:block; text-align:center; font-size:11px; letter-spacing:4px; color:var(--red2); margin:-8px 0 6px; opacity:.9}
.navlbl{font-size:10.5px; letter-spacing:3px; color:var(--mute); text-align:left; margin:8px 2px -6px; opacity:.8}
h3.dh{font-family:'Noto Serif KR',serif; font-size:16px; color:var(--gold2); margin:22px 0 8px; padding-bottom:4px; border-bottom:1px solid rgba(201,164,92,.25)}
h4.dh{font-family:'Noto Serif KR',serif; font-size:14.5px; color:var(--red2); margin:16px 0 6px}
ul.dl{margin:0 0 12px; padding-left:18px} ul.dl li{margin:0 0 6px; font-size:15px}
.dbox{position:relative; margin:18px 0 18px; padding:14px 10px 12px; text-align:center; font-size:15px; line-height:1.85; background:none;
  border-top:1px solid rgba(201,164,92,.55); border-bottom:1px solid rgba(201,164,92,.55)}
.dbox::before, .dbox::after{content:'◆'; position:absolute; left:50%; transform:translateX(-50%); font-size:9px; color:var(--red2); background:var(--bg2); padding:0 8px; line-height:1}
.dbox::before{top:-5px} .dbox::after{bottom:-5px}
.dbox b{color:var(--gold2)}
.op p{text-indent:.6em; font-size:16px; line-height:1.95}
.op .pen{text-indent:0; text-align:center; font-family:'Noto Serif KR',serif; color:var(--red2); font-weight:700; font-size:16.5px; margin:14px 0}
.op .wel{text-indent:0; text-align:center; font-family:'Noto Serif KR',serif; color:var(--gold2); font-weight:800; font-size:18px; margin:22px 0 12px}
.op .clo{text-indent:0; text-align:center; font-weight:700; margin-top:14px}
.oppg{text-align:center; font-size:12px; color:var(--mute); letter-spacing:4px; margin:-2px 0 16px}
.oprow{display:flex; justify-content:center; gap:10px; margin-top:22px}
.confirm{margin:14px 0 4px; padding:18px 14px; text-align:center; border:1px solid var(--gold); border-radius:6px; background:rgba(201,164,92,.07)}
.confirm .bigs{font-size:44px; line-height:1.1}
.confirm .answer{margin-top:14px}
.house[disabled]{opacity:.25; cursor:default}

.answer{margin-top:18px; display:flex; gap:8px}
.answer input,.spell input{flex:1; min-width:0; font-family:inherit; font-size:16px; color:var(--ink); background:rgba(0,0,0,.35); border:1px solid rgba(201,164,92,.45); border-radius:4px; padding:11px 12px; outline:none}
.answer input:focus,.spell input:focus{border-color:var(--gold2); box-shadow:0 0 0 3px rgba(201,164,92,.15)}
.btn{font-family:'Noto Serif KR',serif; font-weight:800; font-size:15px; color:#1a1108; background:linear-gradient(180deg, #f0d79c 0%, #c9a45c 55%, #a07f3c 100%); border:1px solid #6b5226; border-radius:3px; padding:11px 16px; cursor:pointer; box-shadow:0 3px 0 #4a3818, 0 6px 16px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35); letter-spacing:1px; white-space:nowrap}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #4a3818}
.btn.ghost{background:transparent; color:var(--gold2); border:1px solid var(--gold); box-shadow:none}
.msg{min-height:1.6em; margin-top:8px; font-size:14px; color:#f0a8ae; text-align:center}
.msg.ok{color:var(--gold2)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.houses{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 8px}
.house{font-family:inherit; text-align:center; cursor:pointer; padding:14px 8px 12px; color:var(--ink); background:rgba(255,255,255,.03); border:1px solid rgba(201,164,92,.3); border-radius:6px; transition:.2s}
.house .s{display:block; font-size:34px; line-height:1.1}
.house small{display:block; color:var(--mute); font-size:12px; margin-top:4px}
.house.red .s{color:var(--red2)} .house.black .s{color:#e8e0d4}
.house:hover,.house.sel{border-color:var(--gold2); background:rgba(201,164,92,.1)}

/* dialogue */
.dlg{margin:4px 0}
.line{display:none; gap:10px; margin:0 0 14px}
.line.show{display:flex; animation:lineIn .6s ease both}
@keyframes lineIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.line .who{flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,#d8313f,#6d0d18); box-shadow:0 0 12px rgba(224,65,79,.4); font-size:20px}
.line .bubble{flex:1; padding:10px 13px; background:rgba(0,0,0,.35); border:1px solid rgba(224,65,79,.3); border-radius:4px 14px 14px 14px; font-size:15.5px}
.line .bubble .nm{display:block; font-size:11.5px; color:var(--red2); letter-spacing:2px; margin-bottom:2px}
.final{display:none; text-align:center; margin:22px 0 8px}
.zone{margin:18px -4px 22px; padding:0 14px 12px; border:1.5px solid #8a7a6a; border-radius:6px; background:rgba(0,0,0,.18)}
.zone.red{border-color:var(--red2)}
.zone .ztab{margin:0 -14px 12px; padding:7px 10px; text-align:center; font-family:'Noto Serif KR',serif; font-weight:800; font-size:13.5px; letter-spacing:1px; color:#fff; background:#3b3029; border-radius:4px 4px 0 0}
.zone.red .ztab{background:#8e1220}
.mapbox{position:relative; margin:10px 0 18px; border-radius:4px; overflow:hidden; box-shadow:0 6px 24px rgba(0,0,0,.5); cursor:zoom-in} .mapbox svg, .mapbox img{display:block; width:100%; height:auto}
.maphint{position:absolute; right:6px; bottom:6px; font-size:11px; padding:2px 8px; border-radius:10px; background:rgba(0,0,0,.6); color:#f3e6c6}
.mapfull{position:fixed; inset:0; z-index:95; background:rgba(5,2,3,.96); display:flex; flex-direction:column; justify-content:center}
.mapfull .mapscroll{overflow:auto; -webkit-overflow-scrolling:touch} .mapfull svg, .mapfull img{display:block; width:250vw; max-width:1600px; height:auto}
.mapfull .mapclose{text-align:center; color:var(--gold2); padding:14px; font-size:15px}
.final.show{display:block; animation:fadein 1.4s ease both; opacity:0}
.line.memo .bubble{background:none; border:0; border-left:2px solid rgba(230,201,138,.5); border-radius:0; padding:4px 0 4px 14px; font-style:italic; color:#e9dcc6; font-size:16px; line-height:1.85}
p.murmur{font-size:14.5px; color:#bfae9c; font-style:italic; border-left:2px solid rgba(224,65,79,.4); padding-left:12px; margin:0 0 10px}
.trial{margin-top:20px; padding-top:16px; border-top:1px solid rgba(201,164,92,.35); text-align:center}
.trial .tk{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:26px} .trial .tq{font-family:'Song Myung','Noto Serif KR',serif; font-weight:400; font-size:23px; color:var(--ink); margin:2px 0 4px}
.trial .ttm{font-family:'Cinzel',serif; font-size:30px; color:var(--gold2); min-height:8px} .trial .tnote{color:#d6c7b4; font-size:14px; line-height:1.8; margin:6px 0 12px}
.trial .tform{text-align:left} .trial .tblk{margin:14px 0; padding:12px; border:1px solid rgba(201,164,92,.25); border-radius:6px; background:rgba(0,0,0,.2)} .trial .tblk small{color:var(--mute)}
.trial .pt{color:var(--gold); font-size:12.5px}
.trial .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px} .trial .chip{min-width:44px; padding:8px 10px; font:inherit; font-size:17px; color:var(--ink); background:rgba(0,0,0,.35); border:1px solid rgba(201,164,92,.4); border-radius:6px; cursor:pointer}
.trial .chip.red{color:var(--red2)} .trial .chip.on{background:var(--gold); color:#1a1108; border-color:var(--gold)} .trial .chip.wide{font-size:15px}
.trial .opt{display:flex; gap:8px; align-items:flex-start; margin:8px 0 0; padding:8px; border-radius:5px; font-size:14.5px; line-height:1.6; cursor:pointer} .trial .opt.on{background:rgba(201,164,92,.16)} .trial .opt input{margin-top:5px}
.trial .tform .btn{display:block; width:100%; margin-top:6px}
.trial .tprop{text-align:left; margin:10px 0; padding:12px; border:1px solid rgba(201,164,92,.25); border-radius:6px; font-size:14.5px; line-height:1.7} .trial .tprop.on{border-color:var(--gold); background:rgba(201,164,92,.12)}
.trial .tprop .pn{color:var(--gold2); font-size:13px} .trial .tprop .vc{float:right; font-family:'Cinzel',serif; font-size:15px}
.trial .twhy{width:100%; box-sizing:border-box; min-height:70px; margin-top:10px; padding:10px; font:inherit; font-size:15px; background:rgba(0,0,0,.35); color:var(--ink); border:1px solid rgba(201,164,92,.4); border-radius:5px} .trial .tprop .pw{color:#d6c7b4} .trial .tprop .btn{margin-top:8px; width:100%}
.trial .twait{padding:14px 6px; color:var(--gold2); line-height:1.9}
.trial .tres{text-align:left; margin:10px 0; padding:12px; border-top:1px solid rgba(201,164,92,.35); font-size:14.5px; line-height:1.8} .trial .tres.me{background:rgba(201,164,92,.1)}
.trial .tres .th{font-family:'Noto Serif KR',serif; font-weight:800; font-size:16px; display:flex; align-items:center; gap:6px} .trial .tres .th b{margin-left:auto; color:var(--gold2); font-family:'Cinzel',serif}
.trial .tres.red .s{color:var(--red2)} .trial .tres i{font-style:normal; display:inline-block; width:18px} .trial .tres i.ok{color:#9fd8a8} .trial .tres i.no{color:#ff6b78}
.vote{margin-top:22px; padding-top:18px; border-top:1px solid rgba(201,164,92,.35); text-align:center}
.vote .vk{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:24px}
.vote .vq{font-family:'Noto Serif KR',serif; font-weight:800; font-size:22px; color:var(--ink); margin:4px 0 12px}
.vote .vq0{color:#d6c7b4; font-size:15px; line-height:1.8; margin:0 0 14px}
.vote .vbtns{display:flex; gap:10px; justify-content:center; margin-top:6px} .vote .vbtns .btn{min-width:110px}
.vote .vt{width:100%; box-sizing:border-box; min-height:74px; padding:12px; font:inherit; font-size:15.5px; background:rgba(0,0,0,.35); color:var(--ink); border:1px solid rgba(201,164,92,.45); border-radius:6px; resize:none}
.vote .vwait{padding:16px 6px; color:var(--gold2); line-height:1.9; border-top:1px solid rgba(201,164,92,.25); border-bottom:1px solid rgba(201,164,92,.25)}
.vote .etitle{font-family:'Noto Serif KR',serif; font-weight:800; font-size:22px; color:var(--red2); margin:2px 0 16px}
.vote .line.show{text-align:left}
.vote .enarr{text-align:left; color:#e2d5c2; font-size:15.5px; line-height:1.9}
.final p{font-family:'Noto Serif KR',serif; font-weight:700; color:var(--gold2); font-size:17px; line-height:1.9; text-shadow:0 0 16px rgba(201,164,92,.35)}
.final .hh{font-family:'Pinyon Script',cursive; font-size:36px; color:var(--red2); font-weight:400}
.tap{display:block; margin:6px auto 0; text-align:center; font-size:13px; color:var(--mute); animation:blink 1.8s infinite; cursor:pointer; background:none; border:0; font-family:inherit}
@keyframes blink{50%{opacity:.35}}

footer.spell{margin-top:26px; padding:16px 16px 14px; border:1px solid rgba(201,164,92,.35); outline:1px solid rgba(201,164,92,.15); outline-offset:4px; border-radius:6px; background:rgba(0,0,0,.25)}
footer.spell label{display:block; text-align:center; font-family:'Noto Serif KR',serif; font-size:13.5px; color:var(--gold2); letter-spacing:3px; margin-bottom:8px}
footer.spell .row{display:flex; gap:8px}
.tiny{font-size:12px; color:var(--mute); text-align:center; margin-top:18px; opacity:.7}
.hide{display:none!important}
.spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hand{transform-origin:50px 50px; transition:transform 2.4s cubic-bezier(.6,0,.2,1)}
.clock{cursor:pointer}
.suit-rec p{margin:0 0 8px; font-size:15.5px} .suit-rec p:last-child{margin:0}
.seal{margin:6px 0 18px; padding:16px 14px; text-align:center; border:1px solid rgba(201,164,92,.35); border-radius:6px; background:rgba(0,0,0,.25)}
.seal .wax{width:54px; height:54px; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; font-size:24px; color:#f3d7a0;
  background:radial-gradient(circle at 35% 30%,#c42a38,#6d0d18 70%); box-shadow:0 0 0 3px rgba(109,13,24,.5), 0 4px 14px rgba(0,0,0,.5)}
.seal .answer{margin-top:10px}
.notice{margin:22px 0 4px; padding:16px 14px; text-align:center; border-top:1px solid rgba(224,65,79,.4); border-bottom:1px solid rgba(224,65,79,.4); background:linear-gradient(90deg,rgba(179,27,43,0),rgba(179,27,43,.14),rgba(179,27,43,0))}
.notice b{display:block; font-family:'Noto Serif KR',serif; color:var(--red2); font-size:16px; margin-bottom:6px}
.small-note{text-align:center; font-size:12.5px; color:var(--mute); margin:-6px 0 12px}
/* easter egg */
.modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:rgba(5,2,3,.82); backdrop-filter:blur(3px); animation:rise .4s ease both}
.modal .box{width:100%; max-width:380px; padding:22px 18px 18px; background:#140709; border:1px solid var(--line); border-radius:6px; text-align:center}
.modal .box p{font-size:14px; color:var(--mute)}
.modal input{display:block; width:100%; margin:0 0 8px; font-family:inherit; font-size:16px; color:var(--ink); background:rgba(0,0,0,.4); border:1px solid rgba(201,164,92,.35); border-radius:4px; padding:10px 12px; outline:none; text-align:center}
.modal .rowb{display:flex; gap:8px; justify-content:center; margin-top:10px}
/* egg: static before the curse */
.tv{position:fixed; inset:0; z-index:59; display:flex; align-items:center; justify-content:center; padding:20px 16px; pointer-events:auto}
.tv canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.22; mix-blend-mode:screen; image-rendering:pixelated}
.tv .bars{position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, transparent 2px 4px)}
.tv .roll{position:absolute; left:0; right:0; height:22%; background:linear-gradient(180deg, transparent, rgba(255,255,255,.07), transparent); animation:roll 2.4s linear infinite}
@keyframes roll{from{top:-25%} to{top:110%}}
.tv .ask{position:relative; z-index:2; max-width:340px; width:100%; text-align:center; padding:26px 18px 22px; background:rgba(8,2,3,.88); border:1px solid rgba(224,65,79,.5); opacity:0; transition:opacity .4s}
.tv .ask.on{opacity:1; animation:askflick 3s infinite}
.tv .ask.on.shake{animation:shake .45s}
.tv .ask p{font-family:'Noto Serif KR',serif; font-weight:800; font-size:20px; line-height:1.6; color:#f1d7d9; margin:0 0 20px; text-shadow:2px 0 rgba(255,0,60,.55), -2px 0 rgba(0,220,255,.35)}
.tv .ask .btn{min-width:120px}
.tv .bang{position:absolute; z-index:3; transform:translate(-50%,-60%); font-family:'Noto Serif KR',serif; font-weight:800; font-size:54px; color:#e0414f; text-shadow:0 0 14px rgba(224,65,79,.8); pointer-events:none; animation:bang .9s ease-out forwards}
@keyframes bang{0%{opacity:0; transform:translate(-50%,-60%) scale(2.2)} 15%{opacity:1; transform:translate(-50%,-60%) scale(1)} 70%{opacity:1} 100%{opacity:0; transform:translate(-50%,-90%)}}
@keyframes askflick{0%,100%{opacity:1} 41%{opacity:1} 42%{opacity:.35} 43%{opacity:1} 77%{opacity:1} 78%{opacity:.6; transform:translateX(3px)} 79%{opacity:1; transform:none}}
body.glitchy header, body.glitchy main{animation:tear .18s steps(2) infinite}
@keyframes tear{0%{transform:translate(0,0); filter:contrast(1.3) saturate(.6)} 50%{transform:translate(-3px,1px) skewX(1.5deg); filter:contrast(1.6) saturate(.3) hue-rotate(-20deg)} 100%{transform:translate(2px,-1px); filter:contrast(1.2)}}
body.degrade header, body.degrade main{animation:tear2 .12s steps(2) infinite}
@keyframes tear2{0%{transform:translate(-8px,2px) skewX(4deg) scaleY(1.03); filter:blur(2.5px) contrast(2) saturate(0) brightness(1.3)} 50%{transform:translate(9px,-3px) skewX(-3deg); filter:blur(1px) contrast(2.4) hue-rotate(90deg) brightness(.7)} 100%{transform:translate(-2px,0); filter:blur(3px) contrast(1.8) saturate(2) hue-rotate(-60deg)}}
body.degrade .tv canvas{opacity:.65}
body.degrade .tv .ask{filter:blur(1.5px); transform:skewX(-6deg) scale(1.04)}
/* curse: the grinning rabbit */
.curse{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px; text-align:center; background:#000; overflow:hidden; animation:curseIn .25s steps(2) both}
.curse > *{position:relative; z-index:2}
.curse .dial, .curse .grain, .curse .vig{position:absolute; z-index:0; pointer-events:none}
.curse .dial{width:150vmin; height:150vmin; left:50%; top:46%; transform:translate(-50%,-50%); opacity:.13}
.curse .dial line{transform-origin:100px 100px}
.curse .grain{inset:0; width:100%; height:100%; opacity:.09; mix-blend-mode:screen; image-rendering:pixelated}
.curse .vig{inset:0; z-index:1; background:radial-gradient(circle at 50% 40%, rgba(110,0,14,.38) 0%, rgba(0,0,0,0) 42%, rgba(0,0,0,.92) 100%); transition:opacity .25s}
.curse .face{width:150px; filter:drop-shadow(0 0 26px rgba(130,0,18,.55)); animation:breathe 4.5s ease-in-out infinite}
.curse .face svg{width:100%; height:auto; display:block; transition:transform .07s}
@keyframes breathe{50%{transform:scale(1.04)}}
.curse h1{font-family:'Noto Serif KR',serif; font-weight:800; font-size:24px; line-height:1.65; letter-spacing:2px; color:#cdbcb4; margin:22px 0 12px}
.curse h1 span{display:block; opacity:0; filter:blur(6px); animation:reveal 1.1s forwards}
.curse h1 span:nth-child(1){animation-delay:.5s} .curse h1 span:nth-child(2){animation-delay:1.3s; color:#b3121f} .curse h1 span:nth-child(3){animation-delay:2.1s}
@keyframes reveal{to{opacity:1; filter:blur(0)}}
.curse .s1{font-size:14px; line-height:1.8; color:#857470; opacity:0; animation:fadein 1.4s 3s forwards}
.curse .s2{font-family:'Pinyon Script',cursive; font-size:24px; color:#9c8150; opacity:0; margin-top:16px; animation:fadein 1.5s 4s forwards}
.curse button{margin-top:26px; opacity:0; animation:fadein 1s 5s forwards}
.curse.jolt{background:#160003}
.curse.jolt .face svg{transform:scale(1.55) translate(var(--jx,0), var(--jy,0))}
.curse.jolt h1{transform:translateX(var(--jx,0))}
.curse.dark > :not(.face){opacity:.06}
.curse.dark .face svg{filter:brightness(.15)}
body.cursed main{animation:quake .5s 3}
@keyframes curseIn{0%{opacity:0} 50%{opacity:1; filter:invert(1)} 100%{opacity:1}}
@keyframes throb{50%{transform:scale(1.15)}}
@keyframes fadein{to{opacity:1}}
@keyframes glitch{0%,86%,100%{transform:none} 88%{transform:translate(-4px,2px) skewX(8deg)} 92%{transform:translate(5px,-2px)} 95%{transform:translate(-2px,0) skewX(-6deg)}}
@keyframes quake{25%{transform:translate(-5px,3px) rotate(-.6deg)} 75%{transform:translate(5px,-3px) rotate(.6deg)}}

/* fun: red rabbit horror */
.horror{position:fixed; inset:0; z-index:70; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; text-align:center; overflow:hidden; animation:hflick 2.2s steps(1) both}
.horror .eyes{display:flex; gap:38px; margin-bottom:34px; opacity:0; animation:eyesIn 2.4s .6s ease forwards}
.horror .eyes i{display:block; width:18px; height:10px; border-radius:50%; background:#ff1f2f; box-shadow:0 0 18px 6px rgba(255,20,40,.75), 0 0 60px 20px rgba(160,0,20,.5); animation:blinkEye 3.8s 3s infinite}
.horror .t1{font-family:'Noto Serif KR',serif; font-weight:800; font-size:30px; color:#e8202f; letter-spacing:2px; min-height:1.5em; text-shadow:0 0 16px rgba(255,0,30,.7)}
.horror .t2{font-family:'Noto Serif KR',serif; font-size:16px; color:#c9a0a4; margin-top:18px; min-height:1.5em; opacity:0; transition:opacity 1.4s}
.horror .t3{font-family:'Noto Serif KR',serif; font-weight:800; font-size:20px; color:#fff; margin-top:26px; opacity:0; transition:opacity .15s}
.horror .t3.on{opacity:1; animation:glitch .9s infinite}
.horror .drip{position:absolute; top:0; width:6px; border-radius:0 0 6px 6px; background:linear-gradient(#5a0008,#b0101f); animation:drip linear forwards}
.horror .close{position:absolute; bottom:28px; left:0; right:0; font-size:12px; color:#6b4a4d; opacity:0; animation:fadein 1s 13s forwards}
body.jolt{animation:quake .12s 4}
@keyframes hflick{0%{background:#000} 8%{background:#3a0006} 10%{background:#000} 14%{background:#210003} 16%{background:#000}}
@keyframes eyesIn{0%{opacity:0; transform:scale(.6)} 60%{opacity:.4} 100%{opacity:1; transform:scale(1)}}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
@keyframes drip{from{height:0} to{height:var(--h)}}

.horror canvas.static{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; opacity:.08; mix-blend-mode:screen; pointer-events:none}
.horror .vign{position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.95) 100%); pointer-events:none}
.horror .eyes, .horror .t1, .horror .t2, .horror .t3{position:relative; z-index:2}
.horror .eyes{transition:transform 3.5s ease-in, opacity .2s}
.horror .eyes.near{animation:none; opacity:1; transform:scale(2.6)}
.horror .t1.jit{animation:jit .12s infinite}
@keyframes jit{0%{transform:translate(0,0)} 25%{transform:translate(-1px,1px)} 50%{transform:translate(1px,-1px) skewX(2deg)} 75%{transform:translate(-1px,0)}}
.horror .spam{position:absolute; inset:0; pointer-events:none; z-index:1}
.horror .spam span{position:absolute; color:#7a0010; font-family:'Noto Serif KR',serif; font-weight:800; opacity:0; animation:spamIn .25s ease forwards; text-shadow:0 0 6px rgba(255,0,30,.5); white-space:nowrap}
@keyframes spamIn{from{opacity:0; filter:blur(4px)} to{opacity:.85; filter:none}}
.horror .face{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:5; opacity:0; pointer-events:none}
.horror .face svg{width:118vw; max-width:none; height:118vh}
.horror .face.on{opacity:1; animation:faceIn .18s steps(2) both}
.horror .face.gone{opacity:0; transition:opacity .4s}
@keyframes faceIn{0%{transform:scale(.4); opacity:0} 50%{transform:scale(1.15); opacity:1} 100%{transform:scale(1)}}
.horror.inv{filter:invert(1) hue-rotate(180deg)}
.horror.shake{animation:hshake .07s infinite}
@keyframes hshake{0%{transform:translate(0,0)} 25%{transform:translate(-14px,9px) rotate(-1.5deg)} 50%{transform:translate(12px,-10px)} 75%{transform:translate(-8px,-6px) rotate(1deg)}}
.horror .hands{position:absolute; inset:0; z-index:3; pointer-events:none}
.horror .hp{position:absolute; width:70px; filter:drop-shadow(0 0 4px #300); animation:fadein .12s both}
.horror .hp svg{width:100%; height:auto; display:block}
.horror .t3{font-size:24px!important; color:#ff2a3a!important; text-shadow:0 0 18px #f00}

/* fun: pranks */
html.fx-neon body{animation:neon 1.1s linear infinite}
@keyframes neon{0%{filter:hue-rotate(80deg) saturate(4) brightness(1.3) contrast(1.2)} 50%{filter:hue-rotate(200deg) saturate(5) brightness(1.5) contrast(1.3)} 100%{filter:hue-rotate(440deg) saturate(4) brightness(1.3) contrast(1.2)}}
html.fx-invert body{filter:invert(1) hue-rotate(180deg); animation:wob 0.9s ease-in-out infinite}
@keyframes wob{50%{transform:skewX(3deg) scale(1.01)}}
html.fx-flip main{transform:rotate(180deg); transition:transform .9s cubic-bezier(.5,-0.4,.4,1.4)}
main{transition:transform .9s}
.funtoast{position:fixed; left:0; right:0; top:38%; margin:0 auto; width:max-content; z-index:80; text-align:center; padding:22px 26px; border-radius:10px; font-family:'Noto Serif KR',serif; font-weight:800; font-size:26px; line-height:1.5; color:#fff; background:rgba(8,2,4,.94); box-shadow:0 0 40px rgba(0,0,0,.6); animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; max-width:86vw}
.funtoast small{display:block; font-size:15px; font-weight:400; margin-top:6px; opacity:.9}
.fx-t-neon{color:#39ff14; text-shadow:0 0 12px #39ff14, 0 0 30px #ff00e6; border:2px solid #ff00e6}
.fx-t-invert{color:#ff3b4a}
.fx-t-flip{color:#e6c98a}

/* lasting blood */
.blood{position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden}
.blood .bdrip{position:absolute; top:-4px; height:var(--h); border-radius:0 0 8px 8px; background:linear-gradient(#4a0008, #8a0010 70%, #a3001a); box-shadow:0 0 3px rgba(80,0,0,.6); opacity:.85; animation:bdrip 4s ease-out both}
.blood .bdrip::after{content:""; position:absolute; bottom:-5px; left:50%; width:160%; height:9px; transform:translateX(-50%); border-radius:50%; background:#a3001a}
@keyframes bdrip{from{height:0}}
.blood .bhand{position:absolute; width:72px}
.blood .bhand svg{width:100%; height:auto; display:block}
.blood .bsplat{position:absolute; border-radius:50%; background:radial-gradient(circle at 40% 35%, #b0001c, #5a0008 70%); opacity:.75}
.goal{position:relative; margin:14px 0 24px; padding:20px 8px 16px; text-align:center; font-size:15px; line-height:1.85; color:var(--ink);
  border-top:1px solid var(--gold); border-bottom:1px solid var(--gold); background:radial-gradient(ellipse at 50% 50%, rgba(201,164,92,.10), rgba(0,0,0,0) 70%)}
.goal .gl{position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--bg2); padding:0 10px; font-family:'Noto Serif KR',serif; font-weight:800; font-size:13px; letter-spacing:4px; color:var(--gold2); white-space:nowrap}
.goal b{color:var(--gold2)}

/* welcome gate + sound toggle */
.welcome{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:20px 16px; background:radial-gradient(circle at 50% 40%, #241a0e 0%, #070606 70%); transition:opacity .9s}
.welcome.out{opacity:0; pointer-events:none}
.welcome .wbox{max-width:380px; width:100%; text-align:center; padding:30px 22px 26px; border:1px solid var(--gold); outline:1px solid rgba(201,164,92,.35); outline-offset:6px; background:rgba(20,8,10,.85); box-shadow:0 0 50px rgba(0,0,0,.6), inset 0 0 40px rgba(120,20,30,.25); animation:rise 1s ease both}
.welcome .wsuits{color:var(--gold); letter-spacing:8px; font-size:14px} .welcome .wsuits .r{color:var(--red2)}
.welcome .wscript{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:27px; margin:10px 0 6px; text-shadow:0 0 14px rgba(201,164,92,.4)}
.welcome h1{font-family:'Noto Serif KR',serif; font-weight:800; color:var(--ink); font-size:21px; line-height:1.65; margin:6px 0 14px; letter-spacing:1px}
.welcome .wline{width:60%; height:1px; margin:0 auto 16px; background:linear-gradient(90deg, transparent, var(--gold), transparent)}
.welcome p{font-size:14.5px; color:#d6c7b4; margin:0 0 10px}
.welcome .wnote{color:var(--red2); font-size:13.5px; margin-bottom:20px}
.welcome .btn{display:block; width:100%; margin-bottom:10px}
.welcome .wname{display:block; width:100%; box-sizing:border-box; margin:0 0 12px; padding:12px; text-align:center; font-size:16px; background:rgba(0,0,0,.35); color:var(--ink); border:1px solid rgba(201,164,92,.5); border-radius:4px}
/* live: event gate, messages from the host */
.evov{position:fixed; inset:0; z-index:85; display:flex; align-items:center; justify-content:center; padding:20px 16px; background:radial-gradient(circle at 50% 40%, rgba(40,30,16,.97), rgba(5,4,3,.98)); animation:rise .6s ease both}
.evov .eb{max-width:380px; width:100%; text-align:center; padding:34px 20px 30px; border:1px solid var(--gold); outline:1px solid rgba(201,164,92,.3); outline-offset:7px}
.evov .ek{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:40px; line-height:1.1}
.evov h2{font-size:32px; margin:10px 0 8px; color:var(--ink)}
.evov .ew{margin-top:14px} .evov .btn{min-width:140px; margin-top:10px}
.evov .es{color:var(--red2); margin:0 0 6px; font-size:15px}
.evov p{color:#d6c7b4; font-size:14.5px; line-height:1.8; margin:0 0 18px}
.livemsg{position:fixed; left:12px; right:12px; top:14px; z-index:88; margin:0 auto; max-width:420px; padding:16px 18px 14px; background:rgba(14,5,7,.97); border:1px solid var(--gold); border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.6); animation:rise .4s ease both}
.livemsg .lk{font-family:'Noto Serif KR',serif; font-weight:800; color:var(--gold2); font-size:13px; letter-spacing:3px; margin-bottom:6px}
.livemsg .lt{color:var(--ink); font-size:15.5px; line-height:1.7}
.livemsg small{display:block; color:var(--mute); margin-top:8px; font-size:12px}
.waitact{margin:14px 0 4px; padding:12px; text-align:center; color:var(--gold2); border-top:1px solid rgba(201,164,92,.4); border-bottom:1px solid rgba(201,164,92,.4)}
.welcome .wquiet{all:unset; cursor:pointer; color:var(--mute); font-size:13px; text-decoration:underline}
#sndBtn{position:fixed; right:12px; bottom:12px; z-index:30; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:rgba(20,8,10,.8); font-size:18px; cursor:pointer}
/* fun: party */
.party{position:fixed; inset:0; z-index:70; pointer-events:auto; background:radial-gradient(circle at 50% 40%, rgba(90,30,110,.55), rgba(10,4,14,.85)); animation:fadein .4s both; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; opacity:0}
.party canvas{position:absolute; inset:0}
.party .hh{position:relative; font-family:'Pinyon Script',cursive; font-size:54px; color:#ff9a1f; text-shadow:0 0 22px rgba(255,140,20,.8), 0 0 4px #fff; animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.party .sub{position:relative; font-family:'Noto Serif KR',serif; font-weight:800; color:#f3e3ff; font-size:16px; margin-top:6px; animation:fadein 1s .6s both; opacity:0}
.party .fall{position:absolute; top:-60px; font-size:30px; animation:fall linear forwards; pointer-events:none}
@keyframes pop{from{transform:scale(.2) rotate(-12deg); opacity:0} to{transform:none; opacity:1}}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
</style>

기억도 조금씩 함께 지워졌습니다."],["b","첫날에는 알고 있었습니다. 자신이 어디에서 왔는지, 누가 자신을 이곳에 보냈는지, 무엇을 약속했는지. 하지만 매일 아침 초대장을 받고, 매일 밤 요괴들 사이에서 웃는 사이, 그 인간은 하나씩 잊어갔습니다."],["b","그리고 마침내, 자신도 초대장을 받은 요괴라고 믿게 되었습니다."],["b","경계의 정원에서 백 년이 흐르는 동안, 이승에서는 고작 한 해가 흘렀습니다. 붉은 토끼는 토끼굴 밖에서 그 한 해를 기다렸습니다. 토끼굴은 이승에 할로윈이 찾아오는 밤에만 열리니까요."],["b","그리고 오늘, 이승에 다시 할로윈이 찾아왔습니다."],["b","다과회가 한창이던 그때, 토끼굴 쪽에서 아주 오랫동안 듣지 못한 발소리가 들려왔습니다. 붉은 털의 토끼 한 마리가 연회장 한가운데로 걸어 들어와, 정중하게 고개를 숙였습니다."],["p","\"오랜만입니다. 다들 저를 잊으셨겠지요. 붉은 토끼입니다.<br>오늘 밤, 이 만찬의 진행을 맡게 되었습니다.<br>멈춰 버린 경계의 시간을 다시 흐르게 하기 위해서요.<br>그러려면 먼저 한 가지 비밀을 알려드려야겠군요.<br>백 년 전 그 인간은, 지금 이 파티장 안에 있습니다.\""]]},{"title":"III. 오늘 밤, 토끼굴이 열린다","blocks":[["b","웅성거리는 요괴들을 천천히 둘러보며, 붉은 토끼는 말을 이었습니다."],["p","\"그 인간은 여러분과 함께 웃고, 여러분 곁에서 잔을 들고,<br>어쩌면 지금 제 이야기를 누구보다 흥미롭게 듣고 있을지도 모릅니다.<br>본인조차 모른 채로 말이지요.\""],["b","토끼굴은 오늘 자정까지만 열려 있습니다. 문이 닫히기 전에 우리는 사라진 회중시계를 되찾아야 합니다. 그 시계가 걸어간 길은 경계의 문 너머에 새겨져 있지요."],["b","하지만 경계의 문은 네 가문이 모두 동의해야만 열립니다. 백 년 동안 서로를 탓하며 등을 돌려 온 네 가문이, 오늘 밤만큼은 한자리에 모여야 합니다."],["b","그래야만 이 하루가 끝나고, 백 년 만에 진짜 내일이 찾아올 테니까요."],["b","만약 실패한다면, 이 하루는 또 백 년 동안 되풀이되고, 이승의 할로윈마저 위태로워집니다."],["p","\"자, 이제 초대장을 확인해 주십시오. 그 카드 한 장이,<br>백 년 전 누군가의 손에 쥐어져 있던 바로 그 초대장일지도 모르니까요.\""],["w","\"할로윈 밤, 백 년째 이어지는<br>저승의 생일 다과회에 오신 것을 환영합니다.\""],["p","\"부디, 오늘 밤은 무언가를 잊지 마시길.\""],["c","초대장을 간직하십시오.<br>그리고 자정이 오기 전에, 회중시계를 찾아내십시오."]]}],"rules":[{"t":"h","v":"게임 안내"},{"t":"box","v":"**오늘 밤의 목표**: 회중시계를 찾고 태엽을 감는 방법을 알아내어, 경계의 정원의 시간을 다시 정상적으로 흐르게 하십시오."},{"t":"p","v":"토끼굴은 오늘 자정까지만 열려 있습니다. 그 전에 해내지 못하면, 이 하루는 또 백 년 동안 반복되어 아무도 안식을 찾지 못하고, 이승의 할로윈도 무사히 끝나지 못합니다."},{"t":"dh","v":"흩어진 기억"},{"t":"p","v":"100년 전 그 밤의 시간의 손님은 한 인간이었습니다. 인간은 자정에 시계를 감고 돌아가야 했지만, 돌아가지 않았고 시계도 사라졌습니다."},{"t":"p","v":"같은 하루가 되풀이될 때마다 그 인간의 기억은 조금씩 흩어졌습니다. 매일 아침 초대장을 받는 사이, 어느새 자신도 초대장을 받은 요괴라고 믿게 되었지요. **그 인간은 지금 이 파티장 안에 있습니다. 본인조차 모른 채로요.** 오늘 밤 여러분은 모두 저승의 요괴입니다. 단 한 명만 빼고요."},{"t":"p","v":"흩어진 기억은 네 가문에 남은 **백 년 전의 기록** 속에, 그리고 그 밤을 곁에서 지켜본 **망자들**의 기억 속에 남아 있습니다."},{"t":"dh","v":"등장인물"},{"t":"li","v":"**오구리 왕**: 저승의 지배자. 오늘은 그의 생일입니다."},{"t":"li","v":"**붉은 토끼**: 해마다 시간의 손님을 이곳에 보내는 안내자. 오늘 백 년 만에 처음으로 토끼굴을 지나 들어왔습니다. 오늘 밤의 진행과 자정의 재판을 맡습니다."},{"t":"li","v":"**망자 2명**: 그 밤을 곁에서 지켜본, 어느 가문에도 속하지 않은 손님들. 2막에 나타납니다."},{"t":"li","v":"**요괴 24명**: 네 가문에 6명씩. 이 중 한 명이 인간입니다."},{"t":"dh","v":"입장할 때 받는 것"},{"t":"li","v":"**초대장 카드 (트럼프 카드 1장)**: 카드의 문양이 곧 당신의 가문입니다. 인간이 누구인지 가리키는 단서는 이 카드의 문양과 숫자에 관련되어 있습니다."},{"t":"li","v":"**뱃삯 동전 1개**"},{"t":"li","v":"**기억 봉투 1개**: 자정의 재판이 끝날 때까지 절대 열지 마세요."},{"t":"dh","v":"기본 규칙"},{"t":"li","v":"초대장 카드는 다른 사람과 바꾸거나 버릴 수 없습니다."},{"t":"li","v":"카드를 누구에게 보여줄지는 자유입니다. **본인이 인간인 것을 모르지만, 인간임이 드러나지 않기 위해서는 숫자를 적당히 숨기는 것도 방법입니다.**"},{"t":"li","v":"카드의 세기는 2가 가장 약하고 A가 가장 강합니다. (2 < 7 < J < Q < K < A)"},{"t":"li","v":"말로 하는 거짓말은 허용됩니다. 카드를 조작하거나 남의 카드를 몰래 훔쳐보는 것은 금지입니다."},{"t":"li","v":"얻은 단서와 가문의 비밀을 다른 가문에 알려줄지 숨길지는 자유입니다."},{"t":"dh","v":"뱃삯 동전"},{"t":"p","v":"동전은 기억을 사는 돈이자, 마지막에 가문의 순위를 정하는 점수입니다. 동전을 쓰면 단서를 얻지만, 그만큼 순위는 내려갑니다."},{"t":"dh4","v":"얻는 방법"},{"t":"li","v":"입장할 때 1개"},{"t":"li","v":"**보물찾기**: 저승 곳곳에 뱃삯 동전이 숨겨져 있습니다. 찾은 동전은 찾은 사람의 것입니다."},{"t":"li","v":"**회중시계**를 가장 먼저 손에 넣은 가문: 5개"},{"t":"li","v":"**자정의 재판**: 질문을 맞힌 가문은 동전을 받습니다. 질문은 그때 경계의 문 너머에서 공개됩니다."},{"t":"dh4","v":"쓰는 곳"},{"t":"li","v":"**망자의 기억** (2막): 동전 3개에 기억 하나"},{"t":"dh4","v":"주고받기"},{"t":"li","v":"동전은 가문에 상관없이 누구에게나 주거나 빌려줄 수 있습니다. 다른 가문과 동전을 모아 기억을 함께 사도 됩니다."},{"t":"li","v":"게임이 끝났을 때 동전은 **그 동전을 가진 사람의 가문**으로 셉니다. **동전이 가장 많은 가문에게는 붉은 토끼의 특별한 선물이 있습니다.**"},{"t":"dh","v":"단서를 얻는 방법"},{"t":"li","v":"**경계의 문 (1막)**: 네 가문의 열쇠 조각(QR)을 맞추면 열립니다. 문 너머의 문제를 풀면 되감기지 않은 기록이 나옵니다."},{"t":"li","v":"**백 년 전의 기록 (2막)**: 잘 찾아보니, 각 가문에는 **백 년 전 그 밤의 기록**이 남아 있었습니다. 경계의 문 너머에서는 자기 가문의 기록만 열립니다. 다른 가문의 기록이 궁금하다면, 화합을 제의해 보세요."},{"t":"li","v":"**망자의 기억 (2막)**: 망자에게 동전 3개를 내면 단어 하나를 알려 줍니다. 경계의 문 너머 \"백 년 전의 기록\" 장에서 \"망자의 기억을 구매하시겠습니까?\"를 누르고, 그 기억 칸에 단어를 적으면 기억이 열립니다."},{"t":"li","v":"**가문의 비밀**: 네 가문은 저마다 그 밤의 일을 하나씩 숨기고 있습니다. 대화와 화합으로 캐내 보세요."}],"phase":[{"t":"h","v":"페이즈 안내"},{"t":"dh4","v":"18:40 ~ 19:00  입장"},{"t":"p","v":"초대장 카드, 동전, 기억 봉투를 받고 자신의 가문을 확인하세요."},{"t":"dh4","v":"19:00 ~ 19:10  오프닝"},{"t":"p","v":"이승에 다시 할로윈이 찾아오고, 토끼굴을 지나 붉은 토끼가 다과회에 나타납니다. 오프닝이 끝나면 가문마다 경계의 문 열쇠 조각이 하나씩 전달됩니다."},{"t":"dh4","v":"19:10 ~ 20:10  1막 - 4문양 화합의 만찬"},{"t":"p","v":"**먼저 경계의 정원의 만찬을 마음껏 즐기십시오.** 네 문양이 한자리에 모이는 화합의 모임이 이루어지면 경계의 문이 열립니다. 이후 각 가문으로 돌아가 문제의 답을 찾아보세요. **회중시계는 먼저 찾는 가문의 것입니다.**"},{"t":"dh4","v":"20:10 ~ 20:20  중간 이벤트 - 시간의 비밀"},{"t":"p","v":"되찾은 시계를 붉은 토끼가 살펴봅니다. 이 시각이 되면 휴대폰에 큰 알림이 뜨고, \"시간의 비밀\"이 열립니다."},{"t":"dh4","v":"20:20 ~ 21:00  2막 - 오래된 기억을 모아"},{"t":"p","v":"2막이 시작되면 휴대폰에 알림이 뜨고, 우리 가문에 남아 있던 \"백 년 전의 기록\"이 열립니다. 또한, 강가의 망자들의 \"기억 판매\"가 시작됩니다. 기록과 망자의 기억, 가문의 비밀을 모아 백 년 전 그 밤의 진실을 추리하세요."},{"t":"p","v":"**망자에게 줄 뱃삯 동전이 부족하다면, 정원을 잘 살펴보세요.**"},{"t":"dh4","v":"21:00 ~ 21:20  자정의 재판과 결말"},{"t":"p","v":"재판이 시작되면 휴대폰에 알림이 뜨고 자정의 재판 질문이 열립니다. 가문마다 합의한 답을 메모 한 장에 적어 붉은 토끼에게 제출합니다. 이어서 모두 함께 기억 봉투를 열고, 백 년 전 그 밤의 진실과 가문 순위를 확인합니다. **그리고 마지막에, 모두에게 하나의 질문이 주어집니다. 그 답이 이야기의 결말을 바꿉니다.**"},{"t":"p","v":"토끼굴이 닫히기 전에 해내지 못하면, 이 하루는 또 백 년 동안 반복되고, 당신들은 그동안 안식을 찾지 못한 채 저승으로 건너갈 수 없게 됩니다. 행운을 빕니다."}]}};

const norm = s => (s||'').normalize('NFC').toLowerCase().replace(/[\s.,!?'"“”‘’·:;\-~()]/g,'');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(ch, input){
  const L = DATA.locks[ch]; if(!L || !crypto.subtle) return null;
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(input), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(L.salt), iterations:L.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  for(const box of L.boxes){
    try{
      const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(box.iv)}, key, b64(box.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){}
  }
  return null;
}

function poem(h){
  h = h.replace('요괴들에게 하나의 질문이', '요괴들에게<br>하나의 질문이');
  return h.split(/(?<=[.?!…](?:["”’]|<\/b>)?)\s+/).map(x => {
    if(x.includes('<br>') || x.replace(/<[^>]+>/g, '').length <= 30) return x;
    const cs = [...x.matchAll(/, /g)].map(m => m.index); if(!cs.length) return x;
    const mid = x.length / 2, c = cs.reduce((a, b) => Math.abs(b - mid) < Math.abs(a - mid) ? b : a);
    return x.slice(0, c + 1) + '<br>' + x.slice(c + 2);
  }).join('<br>');
}

  };

  else setTimeout(step, 500);

}

// one strike of a big church bell: inharmonic partials (hum, prime, tierce, quint, nominal...) each doubled and slightly detuned so it shimmers, plus the clapper's knock
function bellStrike(A, dest, t, vol = 1, base = 196, ds = 1){
  [[.5, .5, 9], [1, .75, 7.5], [1.19, .32, 5.5], [1.5, .28, 4.5], [2, .42, 5], [2.5, .16, 3.2], [3, .14, 2.6], [4.07, .09, 1.9], [5.2, .05, 1.3]].forEach(([r, g, d0]) => { const d = d0 * ds;
    [-.0016, .0016].forEach(dt => { const o = A.createOscillator(), gn = A.createGain(); o.type = 'sine'; o.frequency.value = base * r * (1 + dt);
      gn.gain.setValueAtTime(.0001, t); gn.gain.exponentialRampToValueAtTime(g * vol * .5, t + .008); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
      o.connect(gn); gn.connect(dest); o.start(t); o.stop(t + d + .1); }); });
  const n = Math.floor(A.sampleRate * .05), b = A.createBuffer(1, n, A.sampleRate), ch = b.getChannelData(0); for(let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = A.createBufferSource(); s.buffer = b; const hp = A.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 2400; hp.Q.value = .8;
  const ng = A.createGain(); ng.gain.value = .5 * vol; s.connect(hp); hp.connect(ng); ng.connect(dest); s.start(t);
}
// ---------- sound: welcome gate, ticking clock, doors, phase bells ----------
const SFX = (() => {
  let A = null, master = null, amb = null, on = S.get('sound', true);
  const ctx = () => { if(!A){ try{ A = window.__ac = window.__ac || new (window.AudioContext||window.webkitAudioContext)(); master = A.createGain(); master.gain.value = on ? 1 : 0; const comp = A.createDynamicsCompressor(); comp.threshold.value = -10; comp.ratio.value = 6; master.connect(comp); comp.connect(A.destination); }catch(e){} } if(A && A.state==='suspended') A.resume(); return A; };
  const out = () => { ctx(); return master || (A && A.destination); };
  const noiseBuf = (dur) => { const n = Math.floor(A.sampleRate*dur), b = A.createBuffer(1, n, A.sampleRate), d = b.getChannelData(0); for(let i=0;i<n;i++) d[i] = Math.random()*2-1; return b; };
  // one clock tick, low and heavy like a heartbeat (lub = hi, dub = lo); a second partial keeps it audible on phone speakers
  const tick = (t, hi, vol) => { if(!ctx()) return; const f = hi ? 58 : 72;
    [[1, 1], [2.6, .45]].forEach(([m, v]) => { const o = A.createOscillator(), g = A.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(f*m*1.5, t); o.frequency.exponentialRampToValueAtTime(f*m, t + .06);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol*v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + (hi ? .26 : .19));
      o.connect(g); g.connect(out()); o.start(t); o.stop(t + .3); });
    const src = A.createBufferSource(); src.buffer = noiseBuf(.05); const lp = A.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = hi ? 420 : 520;
    const ng = A.createGain(); ng.gain.setValueAtTime(vol*.5, t); ng.gain.exponentialRampToValueAtTime(.0001, t + .05);
    src.connect(lp); lp.connect(ng); ng.connect(out()); src.start(t); src.stop(t + .06); };
  // entering: the clock beats forward like a heart (0-2s), then rewinds faster and faster (2.1-5.3s) and stops
  const rewind = () => { if(!ctx()) return; const T = A.currentTime + .05;
    for(let i=0;i<3;i++){ tick(T + i*.75, true, .9); tick(T + i*.75 + .22, false, .6); }
    let t = T + 2.15, gap = .3; while(t < T + 4.9){ tick(t, true, .55); t += gap; gap = Math.max(.04, gap*.87); }
    const src = A.createBufferSource(); src.buffer = noiseBuf(3); const bp = A.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
    const t0 = T + 2.2; bp.frequency.setValueAtTime(1400, t0); bp.frequency.exponentialRampToValueAtTime(120, t0 + 2.9);
    const g = A.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + 2); g.gain.exponentialRampToValueAtTime(.0001, t0 + 3);
    src.connect(bp); bp.connect(g); g.connect(out()); src.start(t0); src.stop(t0 + 3.05);
    const tc = T + 5.3; tick(tc, true, 1);
    [131, 196, 262].forEach((f, i) => { const o = A.createOscillator(), og = A.createGain(); o.type = 'sine'; o.frequency.value = f;
      og.gain.setValueAtTime(.0001, tc + i*.1); og.gain.exponentialRampToValueAtTime(.16, tc + i*.1 + .02); og.gain.exponentialRampToValueAtTime(.0001, tc + i*.1 + 2.2);
      o.connect(og); og.connect(out()); o.start(tc + i*.1); o.stop(tc + i*.1 + 2.3); }); };
  // heavy door: an iron latch, two deep wooden clunks, then the door's low boom dying away
  const door = () => { if(!ctx()) return; const T = A.currentTime + .02;
    const thud = (t, v, f0, len) => {
      [[f0, 1, len], [f0 * 2, .45, len * .6], [f0 * 3.1, .2, len * .35]].forEach(([f, gv, d]) => { const o = A.createOscillator(), g = A.createGain(); o.type = 'sine';
        o.frequency.setValueAtTime(f * 1.4, t); o.frequency.exponentialRampToValueAtTime(f * .6, t + d);
        g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v * gv, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + d);
        o.connect(g); g.connect(out()); o.start(t); o.stop(t + d + .05); });
      const src = A.createBufferSource(); src.buffer = noiseBuf(len); const lp = A.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 360;
      const ng = A.createGain(); ng.gain.setValueAtTime(.0001, t); ng.gain.exponentialRampToValueAtTime(v, t + .008); ng.gain.exponentialRampToValueAtTime(.0001, t + len);
      src.connect(lp); lp.connect(ng); ng.connect(out()); src.start(t); src.stop(t + len + .02); };
    // latch: a short bright metal click
    const lsrc = A.createBufferSource(); lsrc.buffer = noiseBuf(.04); const bp = A.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 4;
    const lg = A.createGain(); lg.gain.setValueAtTime(.7, T); lg.gain.exponentialRampToValueAtTime(.0001, T + .04); lsrc.connect(bp); bp.connect(lg); lg.connect(out()); lsrc.start(T);
    thud(T + .18, 1, 92, .55); thud(T + .42, .8, 80, .5);
    // the door swinging: a long low boom with a slow airy sweep
    const t2 = T + .7; thud(t2, .55, 55, 1.6);
    const air = A.createBufferSource(); air.buffer = noiseBuf(1.6); const af = A.createBiquadFilter(); af.type = 'bandpass'; af.Q.value = 1.4;
    af.frequency.setValueAtTime(260, t2); af.frequency.exponentialRampToValueAtTime(90, t2 + 1.5);
    const ag = A.createGain(); ag.gain.setValueAtTime(.0001, t2); ag.gain.exponentialRampToValueAtTime(.35, t2 + .25); ag.gain.exponentialRampToValueAtTime(.0001, t2 + 1.6);
    air.connect(af); af.connect(ag); ag.connect(out()); air.start(t2); air.stop(t2 + 1.62); };
  // phase change: the big bell, three times - deng, deng, deng
  const phase = () => { if(!ctx()) return; const t = A.currentTime + .05; [880, 784, 698, 659, 587, 523].forEach((f, k) => bellStrike(A, out(), t + k * .36, .9, f, .55)); bellStrike(A, out(), t + 2.6, 1.05, 523, .8); };
  // twelve o'clock: the bell tolls six times
  const toll = () => { if(!ctx()) return; const t = A.currentTime + .1; for(let k = 0; k < 6; k++) bellStrike(A, out(), t + k * 1.8, 1.15, 523, .75); };
  // the real church bell recording (the interlude and the last bell); the drawn bell if it can't load
  let rec = null;
  const church = async fallback => { if(!ctx()) return; try{ if(A.state === 'suspended') await A.resume();
      rec = rec || fetch('sfx/church-bell.mp3').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => A.decodeAudioData(b, ok, no)));
      const buf = await rec, s = A.createBufferSource(), g = A.createGain(); s.buffer = buf; g.gain.value = 1.1; s.connect(g); g.connect(out()); s.start(); }
    catch(e){ rec = null; fallback(); } };
  const set = v => { on = v; S.set('sound', v); ctx(); if(master) master.gain.value = v ? 1 : 0; const b = document.querySelector('#sndBtn'); if(b) b.textContent = v ? '🔊' : '🔇'; };
  return { out, rewind, door, phase, toll, church: () => church(toll), set, get on(){ return on; } };
})();

  const m = el('div','livemsg', `<div class="lk">${kicker || '붉은 토끼의 전갈'}</div><div class="lt">${html}</div><small>눌러서 닫기</small>`);
  m.onclick = () => m.remove(); document.body.append(m); try{ navigator.vibrate && navigator.vibrate(80); }catch(e){}
}
let repT = null;
function reportSoon(){ clearTimeout(repT); repT = setTimeout(report, 400); }
function report(){ const N = LIVE.N; if(!N) return;
  N.update('players/' + N.uid, { name: S.get('name', '') || '(이름 없음)', house: house || '', cur, opened: ORDER.filter(c => content[c]).join(','),
    ghosts: Object.keys(gmem).length, seals: seals.length, at: N.now() }).catch(() => {}); }
function needEvent(){
  if(!LIVE.N || !LIVE.restored || !house || LIVE.phase == null) return null;
  for(const [ph, ch] of Object.entries(L_CH)) if(lIdx(LIVE.phase) >= lIdx(ph) && !content[ch]) return ch;
  return null;
}
function checkEvent(){
  const ch = needEvent(), old = $('#evov');
  if(!ch){ if(old) old.remove(); return; }
  const key = ((LIVE.st || {}).open || {})[ch];
  if(old && old.dataset.ch === ch && !(old.dataset.wait && key)) return; if(old) old.remove();
  const [k, t, s2] = L_EVENT[ch];
  const ov = el('div','evov', `<div class="eb"><div class="ek">${k}</div><h2>${t}</h2><div class="es">${s2}</div><p class="ew">무대 화면을 보십시오.<br>붉은 토끼가 문을 여는 중입니다...</p></div>`);
  ov.id = 'evov'; ov.dataset.ch = ch; document.body.append(ov); try{ navigator.vibrate && navigator.vibrate([80, 60, 80]); }catch(e){}
  if(!key){ ov.dataset.wait = '1'; return; }   // opens as soon as the host's screens publish this page
  (async () => { const v = norm(key), c = await tryOpen(ch, v), p = ov.querySelector('.ew');
    if(!c){ p.textContent = '문이 열리지 않습니다. 붉은 토끼를 불러 주세요.'; return; }
    content[ch] = c; keys[ch] = v; S.set('keys', keys); if(ch==='c8' || ch==='c5' || ch==='c7') SFX.church(); else if(ch!=='c6') SFX.phase(); setClock(PHASE_MIN[ch], 2400);
    const b = el('button','btn','확인'); p.replaceWith(b); b.onclick = () => { ov.remove(); go(ch); checkEvent(); }; })();
}
async function inbox(m){
  if(!m) return;
  if(m.type==='msg') liveMsg(esc(m.text).replace(/\n/g, '<br>'));
  else if(m.type==='unlock'){ const v = norm(m.key); const c = await tryOpen(m.ch, v);
    if(c){ content[m.ch] = c; keys[m.ch] = v; S.set('keys', keys); liveMsg('붉은 토끼가 "' + TITLES[m.ch] + '" 문을 열어 주었습니다.'); go(m.ch); checkEvent(); } }
  else if(m.type==='reset'){ try{ Object.keys(localStorage).filter(k => k.startsWith('rrw_')).forEach(k => localStorage.removeItem(k)); }catch(e){} location.reload(); }
}
addEventListener('net-ready', e => {
  const N = LIVE.N = e.detail;
  N.presence('players/' + N.uid + '/online', true, false);
  N.on('state', st => { const old = LIVE.phase, ov = LIVE.st || {}; LIVE.st = st || {}; LIVE.phase = LIVE.st.phase || 'arrive'; checkEvent();
    if(old !== LIVE.phase) render(); else if(LIVE.redraw && (ov.voteOpen !== LIVE.st.voteOpen || ov.verdict !== LIVE.st.verdict)) LIVE.redraw();
    if(LIVE.trialDraw) LIVE.trialDraw(); });
  N.on('trial', v => { LIVE.trial = v || {}; if(LIVE.trialDraw) LIVE.trialDraw(); });
  N.on('players/' + N.uid + '/inbox', async box => { if(!box) return;
    for(const [id, m] of Object.entries(box)){ await N.remove('players/' + N.uid + '/inbox/' + id); await inbox(m); } });
  N.on('broadcast', b => { if(!b || !b.at || b.at <= LIVE.bcSeen) return; LIVE.bcSeen = b.at; S.set('bcSeen', b.at);
    if(b.to && b.to !== 'all' && b.to !== house) return; liveMsg(esc(b.text).replace(/\n/g, '<br>')); });
  report(); setInterval(report, 30000);
});

// ---------- the midnight trial: propose (2 min) > the house settles on one (1 min) > the Red Hare approves ----------
const T_PROP = 120000, T_AGREE = 60000, T_CARD = 14000, T_RANKS = ['2', '7', 'A', 'J', 'Q', 'K'];
const T_HS = [['spade', '♠', '스페이드'], ['heart', '♥', '하트'], ['diamond', '♦', '다이아'], ['clover', '♣', '클로버']];
const tSuit = k => (T_HS.find(h => h[0] === k) || [])[1] || '';
const tStart = st => (st.trialAt && st.trialFor === st.phaseAt ? st.trialAt : (st.phaseAt || 0) + T_CARD);
function tStep(st, now){ if(!st || st.phase !== 'trial') return ['closed', 0]; const s0 = tStart(st);
  if(now < s0) return ['wait', s0 - now]; if(now < s0 + T_PROP) return ['prop', s0 + T_PROP - now]; if(now < s0 + T_PROP + T_AGREE) return ['agree', s0 + T_PROP + T_AGREE - now]; return ['closed', 0]; }
const tCard = a => a && a.s ? tSuit(a.s) + ' ' + a.r : '-';
const tWhy = a => ((a || {}).why || '').trim() || '-';
const tBad = a => a && a.bad && a.bad.length ? T_HS.filter(h => a.bad.includes(h[0])).map(h => h[1]).join(' ') : '-';
const tFmt = ms => { const x = Math.ceil(ms / 1000); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
const tE = x => esc(String(x ?? ''));
const tVotes = uid => Object.values((LIVE.trial || {}).votes || {}).filter(v => v && v.for === uid).length;
function tHouseAnswer(h){ const ps = Object.entries((LIVE.trial || {}).props || {}).filter(([, p]) => p && p.house === h); if(!ps.length) return null;
  const r = ps.map(([uid, p]) => ({ ...p, uid, votes: tVotes(uid) })).sort((a, b) => (b.votes - a.votes) || (a.at - b.at)); return { ...r[0], how: r[0].votes ? 'vote' : 'first' }; }
function trialBlock(){
  const box = el('div', 'trial'); let shown = '';
  const draw = () => {
    if(!box.isConnected && shown) return;
    const st = LIVE.st || {}, N = LIVE.N, now = N ? N.now() : Date.now(), [step, left] = tStep(st, now), R = st.trialResult, T = LIVE.trial || {};
    const mine = Object.values(T.props || {}).filter(p => p && p.house === house);
    const sig = R ? 'res' + R.at : !N ? 'off' : step + (step === 'prop' || step === 'wait' ? '' : '|' + JSON.stringify(mine) + JSON.stringify(Object.values(T.votes || {}).filter(v => v && v.house === house)));
    const tm = box.querySelector('.ttm'); if(tm) tm.textContent = left ? tFmt(left) : '';
    if(sig === shown) return; shown = sig; box.innerHTML = '';
    if(R){
      box.append(el('div', 'tk', 'The Verdict'), el('h3', 'tq', '자정의 재판 결과'));
      T_HS.forEach(([k, sym, nm]) => { const g = (R.houses || {})[k] || {}, mk = ok => `<i class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</i>`;
        box.append(el('div', 'tres' + (k === house ? ' me' : '') + (/[♥♦]/.test(sym) ? ' red' : ''), `<div class="th"><span class="s">${sym}</span> ${nm} 가문<b>+${g.coins || 0} 동전</b></div>
          <div>${mk(g.q1)} 인간은 <b>${tE(tCard(g))}</b></div><div>${mk(g.q2)} 숨긴 이유: "${tE(tWhy(g))}"</div><div>${mk(g.q3)} 가장 큰 잘못: <b>${tE(tBad(g))}</b></div>`)); });
      box.append(el('p', 'tnote', '얻은 동전은 붉은 토끼가 가문에 건네줍니다.')); return;
    }
    if(!N){ box.append(el('div', 'twait', '실시간 연결이 없습니다. 가문마다 뜻을 모아 종이에 적어 붉은 토끼에게 제출하십시오.')); return; }
    if(!house){ box.append(el('div', 'twait', '가문을 먼저 정해야 재판에 참여할 수 있습니다.')); return; }
    const head = (k, t, sub) => { box.append(el('div', 'tk', k), el('h3', 'tq', t), el('div', 'ttm', left ? tFmt(left) : '')); if(sub) box.append(el('p', 'tnote', sub)); };
    if(step === 'wait'){ head('The Trial', '곧 재판이 시작됩니다', '무대를 보십시오.'); return; }
    if(step === 'prop'){
      head('Your Opinion', '각자 의견을 내십시오', '2분 안에 세 질문에 답해 제출하세요. 시간 안에는 다시 고쳐 낼 수 있습니다.');
      const prev = S.get('trialMine', null) || {}, a = { s: prev.s || '', r: prev.r || '', why: typeof prev.why === 'string' && !/^r\d$/.test(prev.why) ? prev.why : '', bad: (prev.bad || []).slice() };
      const f = el('div', 'tform');
      const q1 = el('div', 'tblk', '<b>1. 인간은 누구인가?</b> <span class="pt">+3</span>'), suits = el('div', 'chips'), ranks = el('div', 'chips');
      T_HS.forEach(([k, sym]) => { const c = el('button', 'chip' + (/[♥♦]/.test(sym) ? ' red' : '') + (a.s === k ? ' on' : ''), sym); c.onclick = () => { a.s = k; suits.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); }; suits.append(c); });
      T_RANKS.forEach(r => { const c = el('button', 'chip' + (a.r === r ? ' on' : ''), r); c.onclick = () => { a.r = r; ranks.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); }; ranks.append(c); });
      q1.append(suits, ranks);
      const q2 = el('div', 'tblk', '<b>2. 인간은 왜 시계를 숨겼는가?</b> <span class="pt">+2</span><br><small>자유롭게 적어 주세요</small>'), why = el('textarea', 'twhy');
      why.maxLength = 80; why.placeholder = '인간이 시계를 숨긴 이유'; why.value = a.why; why.oninput = () => { a.why = why.value; }; q2.append(why);
      const q3 = el('div', 'tblk', '<b>3. 백 년 전 그 밤, 가장 큰 잘못을 한 가문은?</b> <span class="pt">+3</span><br><small>여러 가문을 골라도 됩니다</small>'), hs = el('div', 'chips');
      T_HS.forEach(([k, sym, nm]) => { const c = el('button', 'chip wide' + (/[♥♦]/.test(sym) ? ' red' : '') + (a.bad.includes(k) ? ' on' : ''), sym + ' ' + nm);
        c.onclick = () => { const i = a.bad.indexOf(k); if(i < 0) a.bad.push(k); else a.bad.splice(i, 1); c.classList.toggle('on', i < 0); }; hs.append(c); });
      q3.append(hs);
      const msg = el('div', 'msg'), send = el('button', 'btn', '내 의견 제출');
      if(prev.s) { msg.className = 'msg ok'; msg.textContent = '제출했습니다. 시간 안에는 고쳐서 다시 낼 수 있습니다.'; }
      send.onclick = () => { a.why = why.value.trim(); if(!a.s || !a.r || !a.why || !a.bad.length){ msg.className = 'msg'; msg.textContent = '세 질문에 모두 답해 주세요.'; return; }
        const v = { house, name: S.get('name', '') || '', s: a.s, r: a.r, why: a.why.slice(0, 80), bad: a.bad.slice().sort(), at: N.now() };
        N.set('trial/props/' + N.uid, v).then(() => { S.set('trialMine', v); msg.className = 'msg ok'; msg.textContent = '제출했습니다. 시간 안에는 고쳐서 다시 낼 수 있습니다.'; SFX.door(); })
          .catch(() => { msg.className = 'msg'; msg.textContent = '제출하지 못했습니다. 다시 눌러 주세요.'; }); };
      f.append(q1, q2, q3, send, msg); box.append(f); return;
    }
    if(step === 'agree'){
      head('Vote', '가문 안에서 투표하십시오', '1분 동안 우리 가문 사람들이 낸 의견을 보고, 가장 좋은 답에 한 표를 주세요. 다른 의견으로 바꿔 투표할 수도 있습니다. 가장 많은 표를 받은 의견이 붉은 토끼에게 제출됩니다.');
      const my = ((T.votes || {})[N.uid] || {}).for, list = Object.entries(T.props || {}).filter(([, p]) => p && p.house === house).map(([uid, p]) => ({ ...p, uid, votes: tVotes(uid) })).sort((x, y) => x.at - y.at);
      if(!list.length) box.append(el('div', 'twait', '우리 가문에서 낸 의견이 없습니다.'));
      list.forEach(p => { const on = my === p.uid;
        const d = el('div', 'tprop' + (on ? ' on' : ''), `<div class="pn"><b>${tE(p.name || '이름 없음')}</b>의 의견<span class="vc">${p.votes}표</span></div>
          <div>인간은 <b>${tE(tCard(p))}</b></div><div>가장 큰 잘못 <b>${tE(tBad(p))}</b></div><div class="pw">"${tE(tWhy(p))}"</div>`);
        const b = el('button', 'btn' + (on ? '' : ' ghost'), on ? '✓ 내가 투표한 의견' : '이 의견에 투표');
        b.onclick = () => N.set('trial/votes/' + N.uid, { house, for: p.uid, at: N.now() }).catch(() => {});
        d.append(b); box.append(d); });
      return;
    }
    const ans = tHouseAnswer(house);
    head('The Trial', '붉은 토끼의 판결을 기다리는 중', '제출이 마감되었습니다.');
    box.append(ans ? el('div', 'tprop on', `<div class="pn">우리 가문이 낸 답${ans.how === 'vote' ? ' (' + ans.votes + '표)' : ' (투표가 없어 처음 낸 의견)'}<br>${tE(ans.name || '')}의 의견</div><div>인간은 <b>${tE(tCard(ans))}</b></div><div>가장 큰 잘못 <b>${tE(tBad(ans))}</b></div><div class="pw">"${tE(tWhy(ans))}"</div>`)
      : el('div', 'twait', '우리 가문은 답을 내지 못했습니다.'));
  };
  LIVE.trialDraw = draw; draw(); return box;
}
setInterval(() => { if(LIVE.trialDraw) LIVE.trialDraw(); }, 1000);

// ---------- the last question: live with the human? ----------
function voteBlock(b, ch){
  const box = el('div','vote');
  const draw = () => {
    box.innerHTML = '';
    const st = LIVE.st || {}, online = !!LIVE.N, mine = S.get('myVote', null), sent = S.get('thoughtSent', false);
    const verdict = online ? st.verdict : (mine && sent ? mine : null);
    if(verdict && b.endings[verdict]){ renderEnding(box, b, verdict, ch); return; }
    if(online && !st.voteOpen && !mine){ box.append(el('div','vwait', '시간의 손님의 이야기가 끝났습니다.<br>붉은 토끼가 질문을 꺼낼 때까지, 무대를 바라봐 주십시오.')); return; }
    if(!mine){
      box.append(el('p','vq0', poem(md(b.q[0]))), el('h3','vq', md(b.q[1])));
      const row = el('div','vbtns');
      [['yes', b.endings.yes.label], ['no', b.endings.no.label]].forEach(([k, lab]) => { const bt = el('button', 'btn' + (k==='no' ? ' ghost' : ''), lab);
        bt.onclick = () => { S.set('myVote', k); if(LIVE.N) LIVE.N.set('votes/' + LIVE.N.uid, { v: k, house: house || '', at: LIVE.N.now() }).catch(() => {}); SFX.door(); draw(); };
        row.append(bt); });
      box.append(row); return;
    }
    if(!sent){
      box.append(el('div','vk', 'Your Thoughts'), el('h3','vq', '당신들의 생각'), el('p','vq0', '이 밤에 대한 당신의 생각을 한 줄로 남겨 주십시오.<br>무대에 하나씩 떠오릅니다.'));
      const inp = el('textarea','vt'); inp.maxLength = 80; inp.placeholder = '한 줄로 적어 주세요';
      const row = el('div','vbtns'); const ok = el('button','btn','남기기'), skip = el('button','btn ghost','건너뛰기');
      ok.onclick = () => { const t = inp.value.trim(); if(!t){ inp.focus(); return; }
        if(LIVE.N) LIVE.N.push('thoughts', { text: t.slice(0, 80), house: house || '', v: mine, at: LIVE.N.now() }).catch(() => {});
        S.set('thoughtSent', true); draw(); };
      skip.onclick = () => { S.set('thoughtSent', true); draw(); };
      row.append(skip, ok); box.append(inp, row); return;
    }
    box.append(el('div','vwait', `당신은 "${esc(b.endings[mine].label)}"를 골랐습니다.<br>무대를 보십시오. 모두의 선택이 모이고 있습니다.`));
  };
  LIVE.redraw = draw; draw(); return box;
}
function renderEnding(box, b, k, ch){
  const E = b.endings[k], O = b.endings[k === 'yes' ? 'no' : 'yes'];
  box.append(el('div','vk', 'The Last Bell'), el('h3','etitle', esc(E.title)));
  E.lines.forEach(l => box.append(l.startsWith('r:')
    ? el('div','line show', `<div class="who">🐇</div><div class="bubble"><span class="nm">붉은 토끼</span>${poem(md(l.slice(2)))}</div>`)
    : el('p','enarr', poem(md(l.slice(2))))));
  box.append(el('div','final show', E.finals.map((l, i) => i === E.finals.length - 1 ? `<p class="hh">${esc(l)}</p>` : `<p>${poem(md(l))}</p>`).join('')));
  const other = ['#"' + O.label + '"를 선택한 경우의 미래', ...O.lines.map(l => l.startsWith('r:') ? '붉은 토끼: "' + l.slice(2) + '"' : l.slice(2)), ...O.finals];
  renderBlocks(box, [{ t: 'hidden', v: [...b.hidden, ...other] }], ch);
  if(!S.get('verdictSeen', false)){ S.set('verdictSeen', true); SFX.church(); setClock(720, 2400); } else if(!clockBusy) setClock(720, 0);
}

// ---------- restore ----------
(async () => {
  for(const ch of ORDER){
    if(keys[ch] && DATA.locks[ch]){ const c = await tryOpen(ch, keys[ch]); if(c) content[ch] = c; }
  }
  await loadHouse();
  if(house && !content.house){ house = null; S.set('house', null); S.set('hseal', null); }   // a house without a valid seal must be chosen again
  for(const [id, v] of Object.entries(gkeys)){ const r = await tryOpen(id, v); if(r) gmem[id] = r; }
  for(const v of seals){ await tryOpen('rec', v).then(r => { if(r) recs[r.k] = r; }); }
  if(!clockBusy) setClock(phaseMin(), 0);
  LIVE.restored = true; render(); checkEvent();
})();

// ---------- ambience: embers + spider ----------
(() => {
  const cv = $('#fx'), ctx = cv.getContext('2d'); let W, H, P = [];
  const rs = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  addEventListener('resize', rs); rs();
  for(let i=0;i<34;i++) P.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.6+.4, s:Math.random()*.35+.08, a:Math.random()*Math.PI*2, h:Math.random()<.7});
  (function f(){ ctx.clearRect(0,0,W,H);
    for(const p of P){ p.y -= p.s; p.a += .01; p.x += Math.sin(p.a)*.25; if(p.y < -5){ p.y = H+5; p.x = Math.random()*W; }
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle = p.h ? 'rgba(230,190,120,.55)' : 'rgba(224,65,79,.5)'; ctx.fill(); }
    requestAnimationFrame(f); })();
  const sp = $('#spider');
  const drop = () => { if(!document.querySelector('.modal,.curse')){ sp.classList.add('down'); setTimeout(() => sp.classList.remove('down'), 8000); } setTimeout(drop, 16000 + Math.random()*20000); };
  sp.addEventListener('click', openSpider);
  setTimeout(drop, 6000);
})();
</script>
