<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0708">
<title>경계의 문 · 붉은 토끼의 회중시계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Pinyon+Script&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0708; --bg2:#1a0b0e; --ink:#eadfcd; --mute:#a8998a; --gold:#c9a45c; --gold2:#e6c98a;
  --red:#b31b2b; --red2:#e0414f; --panel:rgba(22,10,12,.78); --line:rgba(201,164,92,.35);
  --accent:#c9a45c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:#0b0506}
body{
  min-height:100vh; color:var(--ink); font-family:'Gowun Batang',serif; font-size:16px; line-height:1.85;
  background:
    radial-gradient(120% 70% at 50% -10%, #3a0d15 0%, rgba(58,13,21,0) 60%),
    radial-gradient(90% 60% at 50% 110%, #22090d 0%, rgba(34,9,13,0) 70%),
    linear-gradient(180deg,#120709 0%, #0b0506 100%);
  background-attachment:fixed; overflow-x:hidden;
}
body::after{ /* vignette */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%);
}
#fx{position:fixed; inset:0; z-index:0; pointer-events:none}
.fog{position:fixed; width:140vw; height:60vh; left:-20vw; pointer-events:none; z-index:0; filter:blur(40px); opacity:.18;
  background:radial-gradient(closest-side, rgba(200,190,190,.55), rgba(200,190,190,0)); animation:drift 38s ease-in-out infinite alternate}
.fog.f1{top:55vh} .fog.f2{top:10vh; animation-duration:52s; opacity:.1; animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-8vw)} to{transform:translateX(8vw)}}

/* spider */
.spider{position:absolute; top:-6px; left:calc(50% + 44px); z-index:6; width:34px; pointer-events:none; cursor:pointer; transform:translateY(-150px); transition:transform 3.2s cubic-bezier(.4,.1,.3,1)}
.spider .thread{position:absolute; left:16px; bottom:30px; width:1px; height:200px; background:linear-gradient(rgba(220,220,220,.0),rgba(220,220,220,.5))}
.spider svg{display:block; pointer-events:auto; padding:6px; margin:-6px; box-sizing:content-box}
.spider-story p{text-align:left; font-size:15px; color:var(--ink); line-height:1.9} .spider-story{max-height:70vh; overflow:auto}
.spider.down{transform:translateY(34px)}
header{position:relative}
.market{margin-top:6px}
.market .slots{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; margin-top:14px}
.slot{min-width:0; overflow-wrap:anywhere; word-break:normal; padding:12px 12px 10px; border:1px solid rgba(201,164,92,.3); border-radius:6px; background:rgba(0,0,0,.25)}
.slot h4{margin:0 0 2px; font-family:'Nanum Myeongjo',serif; font-size:14.5px; color:var(--gold2)}
.slot .answer{margin-top:8px}
.slot .memo{margin-top:8px; padding:10px 12px; border-left:2px solid var(--red2); background:rgba(179,27,43,.08); font-size:15px}
.slot .memo b{display:block; color:var(--red2); font-size:13px; margin-bottom:4px}

main{position:relative; z-index:2; max-width:560px; margin:0 auto; padding:18px 16px 40px}
header{text-align:center; padding:14px 0 6px}
.clock{width:74px; height:74px; margin:0 auto 4px; display:block; filter:drop-shadow(0 0 14px rgba(201,164,92,.35))}
.script{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:30px; line-height:1.1; letter-spacing:.5px; text-shadow:0 0 18px rgba(201,164,92,.35)}
.script .red{color:var(--red2)}
.kr-title{font-family:'Nanum Myeongjo',serif; font-weight:800; color:var(--ink); font-size:14px; letter-spacing:6px; margin-top:6px; opacity:.85}
.suits{color:var(--gold); letter-spacing:10px; font-size:13px; margin:6px 0 0; opacity:.8}
.suits .r{color:var(--red2)}

.badge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--mute); border:1px solid var(--line); border-radius:999px; padding:2px 10px; margin-top:10px}
.badge b{color:var(--accent); font-weight:700}
.badge button{all:unset; cursor:pointer; color:var(--mute); text-decoration:underline; font-size:11.5px; margin-left:4px}

nav.chapters{display:flex; gap:6px; overflow-x:auto; padding:10px 2px 4px; scrollbar-width:none; margin-top:6px}
nav.chapters::-webkit-scrollbar{display:none}
nav.chapters button{flex:0 0 auto; font-family:inherit; font-size:12.5px; color:var(--mute); background:rgba(255,255,255,.03); border:1px solid rgba(201,164,92,.22); border-radius:999px; padding:5px 12px; cursor:pointer}
nav.chapters button.on{color:#1a0b0e; background:var(--gold); border-color:var(--gold)}

.panel{min-width:0; overflow-wrap:anywhere; position:relative; margin-top:14px; padding:26px 20px 24px; background:var(--panel); border:1px solid var(--line); border-radius:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 60px rgba(120,20,30,.15); backdrop-filter:blur(2px); animation:rise .7s ease both}
.panel::before,.panel::after{content:"♥"; position:absolute; font-size:11px; color:var(--red2); opacity:.7}
.panel::before{top:6px; left:9px} .panel::after{content:"♠"; color:var(--gold); bottom:6px; right:9px}
@keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
h2{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:20px; color:var(--gold2); margin:0 0 4px; text-align:center; letter-spacing:1px}
.sub{text-align:center; color:var(--mute); font-size:13px; margin:0 0 18px}
p{margin:0 0 12px}
.center{text-align:center}
.big{font-size:18px; line-height:1.9; color:var(--gold2); margin:18px 0}
.poem{margin:6px 0 18px; padding:14px 16px; border-left:2px solid var(--red); background:rgba(179,27,43,.07); font-size:16.5px; line-height:2}
.poem div{white-space:normal}
.letter{margin:6px 0 16px; padding:6px 0; background:linear-gradient(180deg,#efe3c8,#e3d2ae); color:#2b1d14; border-radius:3px; box-shadow:0 6px 24px rgba(0,0,0,.5)}
.letter .ln{padding:9px 14px; border-bottom:1px dashed rgba(90,60,30,.35); font-size:15px; line-height:1.7}
.letter .ln:last-child{border-bottom:0}
.letter-note{font-size:12.5px; color:var(--mute); margin:-8px 0 16px; text-align:center}
.record{position:relative; margin:4px 0 20px; padding:16px 16px 14px 18px; border:1px solid rgba(201,164,92,.4); background:rgba(201,164,92,.06); border-radius:4px}
.record .tag{position:absolute; top:-10px; left:12px; background:var(--bg2); padding:0 8px; font-size:12px; color:var(--gold); letter-spacing:2px}
.record p{margin:0; font-size:15.5px}
.suit-rec{margin:0 0 16px; padding:14px 16px; border-radius:4px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07)}
.suit-rec h3{margin:0 0 6px; font-family:'Nanum Myeongjo',serif; font-size:15px; color:var(--gold2)}
.suit-rec h3 .r{color:var(--red2)}
.stop{margin:20px 0 4px; padding:12px 14px; text-align:center; border:1px solid rgba(224,65,79,.55); color:#f3c9cc; background:rgba(179,27,43,.12); border-radius:4px; font-size:14.5px; animation:pulse 3.5s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 22px rgba(224,65,79,.35)}}
.q{display:flex; align-items:flex-start; gap:10px; margin:0 0 12px; padding:12px 14px; border-left:2px solid var(--gold); background:rgba(201,164,92,.06)}
.q b{flex:1; color:var(--gold2); font-weight:700} .q .pt{flex:0 0 auto; font-size:13px; color:var(--red2); font-weight:700; white-space:nowrap; margin-top:2px}
nav.guide{padding-top:8px; margin-top:8px}
nav.guide button{color:#f0b7bc; border-color:rgba(224,65,79,.35); background:rgba(179,27,43,.08)}
nav.guide button.on{color:#fff; background:var(--red); border-color:var(--red)}
.line.guest .who{background:radial-gradient(circle at 35% 30%,#f3e6c6,#b89a5e); color:#b31b2b; box-shadow:0 0 12px rgba(230,201,138,.45); font-size:22px}
.line.guest .bubble{border-color:rgba(230,201,138,.45); border-radius:14px 4px 14px 14px}
.line.guest .bubble .nm{color:var(--gold2)}
.hidden-story{text-align:center; margin-top:26px}
.hs-body{text-align:left; margin-top:6px; padding:18px 16px; border-top:1px solid rgba(201,164,92,.3); animation:fadein 1.6s ease both}
.hs-body h3{font-family:'Nanum Myeongjo',serif; text-align:center; color:var(--red2); font-size:16px; letter-spacing:3px; margin:0 0 14px}
.hs-body p{font-size:15px; color:#d9cbbb}
.acttag{display:block; text-align:center; font-size:11px; letter-spacing:4px; color:var(--red2); margin:-8px 0 6px; opacity:.9}
.navlbl{font-size:10.5px; letter-spacing:3px; color:var(--mute); text-align:left; margin:8px 2px -6px; opacity:.8}
h3.dh{font-family:'Nanum Myeongjo',serif; font-size:16px; color:var(--gold2); margin:22px 0 8px; padding-bottom:4px; border-bottom:1px solid rgba(201,164,92,.25)}
h4.dh{font-family:'Nanum Myeongjo',serif; font-size:14.5px; color:var(--red2); margin:16px 0 6px}
ul.dl{margin:0 0 12px; padding-left:18px} ul.dl li{margin:0 0 6px; font-size:15px}
.dbox{margin:8px 0 12px; padding:12px 14px; border:1px solid rgba(224,65,79,.45); background:rgba(179,27,43,.1); border-radius:4px; font-size:15px}
.op p{text-indent:.6em; font-size:16px; line-height:1.95}
.op .pen{text-indent:0; text-align:center; font-family:'Nanum Myeongjo',serif; color:var(--red2); font-weight:700; font-size:16.5px; margin:14px 0}
.op .wel{text-indent:0; text-align:center; font-family:'Nanum Myeongjo',serif; color:var(--gold2); font-weight:800; font-size:18px; margin:22px 0 12px}
.op .clo{text-indent:0; text-align:center; font-weight:700; margin-top:14px}
.oppg{text-align:center; font-size:12px; color:var(--mute); letter-spacing:4px; margin:-2px 0 16px}
.oprow{display:flex; justify-content:center; gap:10px; margin-top:22px}
.confirm{margin:14px 0 4px; padding:18px 14px; text-align:center; border:1px solid var(--gold); border-radius:6px; background:rgba(201,164,92,.07)}
.confirm .bigs{font-size:44px; line-height:1.1}
.confirm .answer{margin-top:14px}
.house[disabled]{opacity:.25; cursor:default}

.answer{margin-top:18px; display:flex; gap:8px}
.answer input,.spell input{flex:1; min-width:0; font-family:inherit; font-size:16px; color:var(--ink); background:rgba(0,0,0,.35); border:1px solid rgba(201,164,92,.45); border-radius:4px; padding:11px 12px; outline:none}
.answer input:focus,.spell input:focus{border-color:var(--gold2); box-shadow:0 0 0 3px rgba(201,164,92,.15)}
.btn{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:15px; color:#f7e6c4; background:radial-gradient(circle at 35% 30%, #d8313f, #8e1220 70%); border:0; border-radius:4px; padding:11px 16px; cursor:pointer; box-shadow:0 3px 0 #5c0b14, 0 6px 16px rgba(0,0,0,.4); white-space:nowrap}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #5c0b14}
.btn.ghost{background:transparent; color:var(--gold2); border:1px solid var(--gold); box-shadow:none}
.msg{min-height:1.6em; margin-top:8px; font-size:14px; color:#f0a8ae; text-align:center}
.msg.ok{color:var(--gold2)}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

.houses{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 8px}
.house{font-family:inherit; text-align:center; cursor:pointer; padding:14px 8px 12px; color:var(--ink); background:rgba(255,255,255,.03); border:1px solid rgba(201,164,92,.3); border-radius:6px; transition:.2s}
.house .s{display:block; font-size:34px; line-height:1.1}
.house small{display:block; color:var(--mute); font-size:12px; margin-top:4px}
.house.red .s{color:var(--red2)} .house.black .s{color:#e8e0d4}
.house:hover,.house.sel{border-color:var(--gold2); background:rgba(201,164,92,.1)}

/* dialogue */
.dlg{margin:4px 0}
.line{display:none; gap:10px; margin:0 0 14px}
.line.show{display:flex; animation:lineIn .6s ease both}
@keyframes lineIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.line .who{flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%,#d8313f,#6d0d18); box-shadow:0 0 12px rgba(224,65,79,.4); font-size:20px}
.line .bubble{flex:1; padding:10px 13px; background:rgba(0,0,0,.35); border:1px solid rgba(224,65,79,.3); border-radius:4px 14px 14px 14px; font-size:15.5px}
.line .bubble .nm{display:block; font-size:11.5px; color:var(--red2); letter-spacing:2px; margin-bottom:2px}
.final{display:none; text-align:center; margin:22px 0 8px}
.final.show{display:block; animation:fadein 1.4s ease both; opacity:0}
.final p{font-family:'Nanum Myeongjo',serif; font-weight:700; color:var(--gold2); font-size:17px; line-height:1.9; text-shadow:0 0 16px rgba(201,164,92,.35)}
.final .hh{font-family:'Pinyon Script',cursive; font-size:36px; color:var(--red2); font-weight:400}
.tap{display:block; margin:6px auto 0; text-align:center; font-size:13px; color:var(--mute); animation:blink 1.8s infinite; cursor:pointer; background:none; border:0; font-family:inherit}
@keyframes blink{50%{opacity:.35}}

footer.spell{margin-top:26px; padding:16px 16px 14px; border:1px dashed rgba(224,65,79,.4); border-radius:6px; background:rgba(0,0,0,.25)}
footer.spell label{display:block; text-align:center; font-family:'Nanum Myeongjo',serif; font-size:13.5px; color:var(--red2); letter-spacing:3px; margin-bottom:8px}
footer.spell .row{display:flex; gap:8px}
.tiny{font-size:12px; color:var(--mute); text-align:center; margin-top:18px; opacity:.7}
.hide{display:none!important}
.spin{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.hand{transform-origin:50px 50px; transition:transform 2.4s cubic-bezier(.6,0,.2,1)}
.clock{cursor:pointer}
.suit-rec p{margin:0 0 8px; font-size:15.5px} .suit-rec p:last-child{margin:0}
.seal{margin:6px 0 18px; padding:16px 14px; text-align:center; border:1px solid rgba(201,164,92,.35); border-radius:6px; background:rgba(0,0,0,.25)}
.seal .wax{width:54px; height:54px; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; font-size:24px; color:#f3d7a0;
  background:radial-gradient(circle at 35% 30%,#c42a38,#6d0d18 70%); box-shadow:0 0 0 3px rgba(109,13,24,.5), 0 4px 14px rgba(0,0,0,.5)}
.seal .answer{margin-top:10px}
.notice{margin:22px 0 4px; padding:16px 14px; text-align:center; border-top:1px solid rgba(224,65,79,.4); border-bottom:1px solid rgba(224,65,79,.4); background:linear-gradient(90deg,rgba(179,27,43,0),rgba(179,27,43,.14),rgba(179,27,43,0))}
.notice b{display:block; font-family:'Nanum Myeongjo',serif; color:var(--red2); font-size:16px; margin-bottom:6px}
.small-note{text-align:center; font-size:12.5px; color:var(--mute); margin:-6px 0 12px}
/* easter egg */
.modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:rgba(5,2,3,.82); backdrop-filter:blur(3px); animation:rise .4s ease both}
.modal .box{width:100%; max-width:380px; padding:22px 18px 18px; background:#140709; border:1px solid var(--line); border-radius:6px; text-align:center}
.modal .box p{font-size:14px; color:var(--mute)}
.modal input{display:block; width:100%; margin:0 0 8px; font-family:inherit; font-size:16px; color:var(--ink); background:rgba(0,0,0,.4); border:1px solid rgba(201,164,92,.35); border-radius:4px; padding:10px 12px; outline:none; text-align:center}
.modal .rowb{display:flex; gap:8px; justify-content:center; margin-top:10px}
.curse{position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; text-align:center;
  background:radial-gradient(circle at 50% 45%, #5a0710 0%, #1a0205 55%, #000 100%); animation:curseIn .25s steps(2) both}
.curse .eye{font-size:64px; filter:drop-shadow(0 0 22px #ff2a3a); animation:throb 1.1s ease-in-out infinite}
.curse h1{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:28px; line-height:1.5; color:#ff3b4a; margin:18px 0 10px;
  text-shadow:0 0 18px rgba(255,40,60,.8), 3px 0 rgba(0,255,255,.25), -3px 0 rgba(255,0,60,.5); animation:glitch 1.6s infinite}
.curse .s1{font-size:15px; color:#f3c9cc; opacity:0; animation:fadein 1.2s 1.6s forwards}
.curse .s2{font-family:'Pinyon Script',cursive; font-size:28px; color:#e6c98a; opacity:0; margin-top:18px; animation:fadein 1.5s 3s forwards}
.curse button{margin-top:28px; opacity:0; animation:fadein 1s 4.2s forwards}
body.cursed main{animation:quake .5s 3}
@keyframes curseIn{0%{opacity:0} 50%{opacity:1; filter:invert(1)} 100%{opacity:1}}
@keyframes throb{50%{transform:scale(1.15)}}
@keyframes fadein{to{opacity:1}}
@keyframes glitch{0%,86%,100%{transform:none} 88%{transform:translate(-4px,2px) skewX(8deg)} 92%{transform:translate(5px,-2px)} 95%{transform:translate(-2px,0) skewX(-6deg)}}
@keyframes quake{25%{transform:translate(-5px,3px) rotate(-.6deg)} 75%{transform:translate(5px,-3px) rotate(.6deg)}}

/* fun: red rabbit horror */
.horror{position:fixed; inset:0; z-index:70; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; text-align:center; overflow:hidden; animation:hflick 2.2s steps(1) both}
.horror .eyes{display:flex; gap:38px; margin-bottom:34px; opacity:0; animation:eyesIn 2.4s .6s ease forwards}
.horror .eyes i{display:block; width:18px; height:10px; border-radius:50%; background:#ff1f2f; box-shadow:0 0 18px 6px rgba(255,20,40,.75), 0 0 60px 20px rgba(160,0,20,.5); animation:blinkEye 3.8s 3s infinite}
.horror .t1{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:30px; color:#e8202f; letter-spacing:2px; min-height:1.5em; text-shadow:0 0 16px rgba(255,0,30,.7)}
.horror .t2{font-family:'Nanum Myeongjo',serif; font-size:16px; color:#c9a0a4; margin-top:18px; min-height:1.5em; opacity:0; transition:opacity 1.4s}
.horror .t3{font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:20px; color:#fff; margin-top:26px; opacity:0; transition:opacity .15s}
.horror .t3.on{opacity:1; animation:glitch .9s infinite}
.horror .drip{position:absolute; top:0; width:6px; border-radius:0 0 6px 6px; background:linear-gradient(#5a0008,#b0101f); animation:drip linear forwards}
.horror .close{position:absolute; bottom:28px; left:0; right:0; font-size:12px; color:#6b4a4d; opacity:0; animation:fadein 1s 13s forwards}
body.jolt{animation:quake .12s 4}
@keyframes hflick{0%{background:#000} 8%{background:#3a0006} 10%{background:#000} 14%{background:#210003} 16%{background:#000}}
@keyframes eyesIn{0%{opacity:0; transform:scale(.6)} 60%{opacity:.4} 100%{opacity:1; transform:scale(1)}}
@keyframes blinkEye{0%,92%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)}}
@keyframes drip{from{height:0} to{height:var(--h)}}

.horror canvas.static{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; opacity:.08; mix-blend-mode:screen; pointer-events:none}
.horror .vign{position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.95) 100%); pointer-events:none}
.horror .eyes, .horror .t1, .horror .t2, .horror .t3{position:relative; z-index:2}
.horror .eyes{transition:transform 3.5s ease-in, opacity .2s}
.horror .eyes.near{animation:none; opacity:1; transform:scale(2.6)}
.horror .t1.jit{animation:jit .12s infinite}
@keyframes jit{0%{transform:translate(0,0)} 25%{transform:translate(-1px,1px)} 50%{transform:translate(1px,-1px) skewX(2deg)} 75%{transform:translate(-1px,0)}}
.horror .spam{position:absolute; inset:0; pointer-events:none; z-index:1}
.horror .spam span{position:absolute; color:#7a0010; font-family:'Nanum Myeongjo',serif; font-weight:800; opacity:0; animation:spamIn .25s ease forwards; text-shadow:0 0 6px rgba(255,0,30,.5); white-space:nowrap}
@keyframes spamIn{from{opacity:0; filter:blur(4px)} to{opacity:.85; filter:none}}
.horror .face{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:5; opacity:0; pointer-events:none}
.horror .face svg{width:118vw; max-width:none; height:118vh}
.horror .face.on{opacity:1; animation:faceIn .18s steps(2) both}
.horror .face.gone{opacity:0; transition:opacity .4s}
@keyframes faceIn{0%{transform:scale(.4); opacity:0} 50%{transform:scale(1.15); opacity:1} 100%{transform:scale(1)}}
.horror.inv{filter:invert(1) hue-rotate(180deg)}
.horror.shake{animation:hshake .07s infinite}
@keyframes hshake{0%{transform:translate(0,0)} 25%{transform:translate(-14px,9px) rotate(-1.5deg)} 50%{transform:translate(12px,-10px)} 75%{transform:translate(-8px,-6px) rotate(1deg)}}
.horror .hands{position:absolute; inset:0; z-index:3; pointer-events:none}
.horror .hp{position:absolute; width:70px; filter:drop-shadow(0 0 4px #300); animation:fadein .12s both}
.horror .hp svg{width:100%; height:auto; display:block}
.horror .t3{font-size:24px!important; color:#ff2a3a!important; text-shadow:0 0 18px #f00}

/* fun: pranks */
html.fx-neon body{animation:neon 1.1s linear infinite}
@keyframes neon{0%{filter:hue-rotate(80deg) saturate(4) brightness(1.3) contrast(1.2)} 50%{filter:hue-rotate(200deg) saturate(5) brightness(1.5) contrast(1.3)} 100%{filter:hue-rotate(440deg) saturate(4) brightness(1.3) contrast(1.2)}}
html.fx-invert body{filter:invert(1) hue-rotate(180deg); animation:wob 0.9s ease-in-out infinite}
@keyframes wob{50%{transform:skewX(3deg) scale(1.01)}}
html.fx-flip main{transform:rotate(180deg); transition:transform .9s cubic-bezier(.5,-0.4,.4,1.4)}
main{transition:transform .9s}
.funtoast{position:fixed; left:0; right:0; top:38%; margin:0 auto; width:max-content; z-index:80; text-align:center; padding:22px 26px; border-radius:10px; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:26px; line-height:1.5; color:#fff; background:rgba(8,2,4,.94); box-shadow:0 0 40px rgba(0,0,0,.6); animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; max-width:86vw}
.funtoast small{display:block; font-size:15px; font-weight:400; margin-top:6px; opacity:.9}
.fx-t-neon{color:#39ff14; text-shadow:0 0 12px #39ff14, 0 0 30px #ff00e6; border:2px solid #ff00e6}
.fx-t-invert{color:#ff3b4a}
.fx-t-flip{color:#e6c98a}

/* lasting blood */
.blood{position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden}
.blood .bdrip{position:absolute; top:-4px; height:var(--h); border-radius:0 0 8px 8px; background:linear-gradient(#4a0008, #8a0010 70%, #a3001a); box-shadow:0 0 3px rgba(80,0,0,.6); opacity:.85; animation:bdrip 4s ease-out both}
.blood .bdrip::after{content:""; position:absolute; bottom:-5px; left:50%; width:160%; height:9px; transform:translateX(-50%); border-radius:50%; background:#a3001a}
@keyframes bdrip{from{height:0}}
.blood .bhand{position:absolute; width:72px}
.blood .bhand svg{width:100%; height:auto; display:block}
.blood .bsplat{position:absolute; border-radius:50%; background:radial-gradient(circle at 40% 35%, #b0001c, #5a0008 70%); opacity:.75}
.goal{position:relative; margin:6px 0 22px; padding:18px 14px 14px; text-align:center; font-size:15px; line-height:1.85; color:var(--ink);
  border:1px solid var(--gold); border-radius:6px; background:linear-gradient(180deg, rgba(201,164,92,.14), rgba(201,164,92,.04)); box-shadow:0 0 18px rgba(201,164,92,.15)}
.goal .gl{position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:var(--bg2); padding:0 10px; font-family:'Nanum Myeongjo',serif; font-weight:800; font-size:13px; letter-spacing:4px; color:var(--gold2); white-space:nowrap}
.goal b{color:var(--gold2)}
/* fun: party */
.party{position:fixed; inset:0; z-index:70; pointer-events:auto; background:radial-gradient(circle at 50% 40%, rgba(90,30,110,.55), rgba(10,4,14,.85)); animation:fadein .4s both; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; opacity:0}
.party canvas{position:absolute; inset:0}
.party .hh{position:relative; font-family:'Pinyon Script',cursive; font-size:54px; color:#ff9a1f; text-shadow:0 0 22px rgba(255,140,20,.8), 0 0 4px #fff; animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
.party .sub{position:relative; font-family:'Nanum Myeongjo',serif; font-weight:800; color:#f3e3ff; font-size:16px; margin-top:6px; animation:fadein 1s .6s both; opacity:0}
.party .fall{position:absolute; top:-60px; font-size:30px; animation:fall linear forwards; pointer-events:none}
@keyframes pop{from{transform:scale(.2) rotate(-12deg); opacity:0} to{transform:none; opacity:1}}
@keyframes fall{to{transform:translateY(115vh) rotate(var(--r))}}
</style>
</head>

de":{"opening":[{"title":"I. 백 년 전의 밤","blocks":[["b","백 년 전의 할로윈 밤이었습니다."],["b","이승에서 뻗어 온 토끼굴이 저승의 가장자리에 닿는 곳, 경계의 정원. 할로윈 밤이면 그곳에서 저승의 생일 다과회가 열렸습니다."],["b","해마다 이승의 할로윈이 되면, 붉은 토끼는 이승에서 한 인간을 골라 경계의 정원에 손님으로 보냈습니다."],["b","그해의 손님은 한 인간이었습니다. 붉은 토끼는 인간의 작은 손바닥 위에 금빛 회중시계 하나와, 다과회에 들어갈 수 있는 초대장, 트럼프 카드 한 장을 올려주었습니다."],["p","\"자정이 되면 이 시계의 태엽을 감으렴.<br>그리고 토끼굴이 닫히기 전에, 꼭 돌아와야 해.\""],["b","인간은 고개를 끄덕였습니다. 그리고 붉은 토끼의 발자국을 따라, 깊고 어두운 토끼굴 속으로 떨어져 내렸습니다."],["b","그러나 그날 밤, 인간은 돌아오지 않았습니다."],["b","회중시계도 어디론가 사라졌습니다. 그리고 자정을 꼭 1분 앞둔 그 순간, 경계의 정원은 자정을 맞지 못한 채 그날 아침으로 되돌아갔습니다."],["b","다음 날도, 그다음 날도 똑같았습니다. 아침이면 초대장이 배달되고, 밤이면 같은 찻잔에 같은 차가 채워졌습니다. 그리고 자정 1분 전이 되면, 모든 것이 다시 처음으로 돌아갔습니다."]]},{"title":"II. 잊어버린 인간","blocks":[["b","저승의 요괴들에게 하루와 백 년은 크게 다르지 않습니다. 어렴풋이 \"어제도 이랬던 것 같은데\" 싶어도, 매일이 즐거웠기에 아무도 묻지 않았지요."],["b","같은 하루 속에서 그 인간은 늙지 않았습니다. 하지만 하루가 지워질 때마다, 기억도 조금씩 함께 지워졌습니다."],["b","첫날에는 알고 있었습니다. 자신이 어디에서 왔는지, 누구의 손을 잡고 이곳에 왔는지, 무엇을 약속했는지. 하지만 매일 아침 초대장을 받고, 매일 밤 요괴들 사이에서 웃는 사이, 그 인간은 하나씩 잊어갔습니다."],["b","그리고 마침내, 자신도 초대장을 받은 요괴라고 믿게 되었습니다."],["b","경계의 정원에서 백 년이 흐르는 동안, 이승에서는 고작 한 해가 흘렀습니다. 붉은 토끼는 토끼굴 밖에서 그 한 해를 기다렸습니다. 토끼굴은 이승에 할로윈이 찾아오는 밤에만 열리니까요."],["b","그리고 오늘, 이승에 다시 할로윈이 찾아왔습니다."],["b","다과회가 한창이던 그때, 토끼굴 쪽에서 낯선 발소리가 들려왔습니다. 붉은 털의 토끼 한 마리가 연회장 한가운데로 걸어 들어와, 정중하게 고개를 숙였습니다."],["p","\"처음 뵙겠습니다. 저는 붉은 토끼라고 합니다.<br>이승에 할로윈이 찾아왔는데, 마침 저승 왕의 생일이라는<br>소문을 듣고 찾아왔지요. 그런데 여러분에게<br>한 가지 비밀을 알려드려야겠군요.<br>백 년 전 그 인간은, 지금 이 파티장 안에 있습니다.\""]]},{"title":"III. 오늘 밤, 토끼굴이 열린다","blocks":[["b","웅성거리는 요괴들을 천천히 둘러보며, 붉은 토끼는 말을 이었습니다."],["p","\"그 인간은 여러분과 함께 웃고, 여러분 곁에서 잔을 들고,<br>어쩌면 지금 제 이야기를 누구보다 흥미롭게 듣고 있을지도 모릅니다.<br>본인조차 모른 채로 말이지요.\""],["b","토끼굴은 오늘 자정까지만 열려 있습니다. 문이 닫히기 전에 우리는 사라진 회중시계를 되찾아야 합니다. 그 시계가 걸어간 길은 경계의 문 너머에 새겨져 있지요."],["b","하지만 경계의 문은 네 가문이 모두 동의해야만 열립니다. 백 년 동안 서로를 탓하며 등을 돌려 온 네 가문이, 오늘 밤만큼은 한자리에 모여야 합니다."],["b","그래야만 이 하루가 끝나고, 백 년 만에 진짜 내일이 찾아올 테니까요."],["b","만약 실패한다면, 이 하루는 또 백 년 동안 되풀이되고, 이승의 할로윈마저 위태로워집니다."],["p","\"자, 이제 초대장을 확인해 주십시오. 그 카드 한 장이,<br>백 년 전 누군가의 손에 쥐어져 있던 바로 그 초대장일지도 모르니까요.\""],["w","\"할로윈 밤, 백 년째 이어지는<br>저승의 생일 다과회에 오신 것을 환영합니다.\""],["p","\"부디, 오늘 밤은 무언가를 잊지 마시길.\""],["c","초대장을 간직하십시오.<br>그리고 자정이 오기 전에, 회중시계를 찾아내십시오."]]}],"rules":[{"t":"h","v":"게임 안내"},{"t":"box","v":"**오늘 밤의 목표**: 회중시계를 찾고 태엽을 감는 방법을 알아내어, 경계의 정원의 시간을 다시 정상적으로 흐르게 하십시오."},{"t":"p","v":"토끼굴은 오늘 자정까지만 열려 있습니다. 그 전에 해내지 못하면, 이 하루는 또 백 년 동안 반복되고 이승의 할로윈도 무사히 끝나지 못합니다."},{"t":"dh","v":"흩어진 기억"},{"t":"p","v":"100년 전 그 밤의 시간의 손님은 한 인간이었습니다. 인간은 자정에 시계를 감고 돌아가야 했지만, 돌아가지 않았고 시계도 사라졌습니다."},{"t":"p","v":"같은 하루가 되풀이될 때마다 그 인간의 기억은 조금씩 흩어졌습니다. 매일 아침 초대장을 받는 사이, 어느새 자신도 초대장을 받은 요괴라고 믿게 되었지요. **그 인간은 지금 이 파티장 안에 있습니다. 본인조차 모른 채로요.** 오늘 밤 여러분은 모두 저승의 요괴입니다. 단 한 명만 빼고요."},{"t":"p","v":"흩어진 기억은 여러 조각으로 찢어져 **네 가문의 초대장**에 새겨졌습니다. 찢어진 기억은 네 문양이 한자리에 모여야만 읽힙니다. 그리고 그 밤을 곁에서 지켜본 **망자들**도, 저마다 본 것을 기억하고 있습니다."},{"t":"dh","v":"등장인물"},{"t":"li","v":"**오구리 왕**: 저승의 지배자. 오늘은 그의 생일입니다."},{"t":"li","v":"**붉은 토끼**: 해마다 시간의 손님을 이곳에 보내는 안내자. 오늘 백 년 만에 처음으로 토끼굴을 지나 들어왔습니다. 오늘 밤의 진행과 자정의 재판을 맡습니다."},{"t":"li","v":"**망자 2명**: 그 밤을 곁에서 지켜본, 어느 가문에도 속하지 않은 손님들. 2막에 나타납니다."},{"t":"li","v":"**요괴 24명**: 네 가문에 6명씩. 이 중 한 명이 인간입니다."},{"t":"dh","v":"입장할 때 받는 것"},{"t":"li","v":"**초대장 카드 (트럼프 카드 1장)**: 카드의 문양이 곧 당신의 가문입니다. 인간이 누구인지 가리키는 단서는 이 카드의 문양과 숫자에 관련되어 있습니다."},{"t":"li","v":"**뱃삯 동전 1개**"},{"t":"li","v":"**기억 봉투 1개**: 자정의 재판이 끝날 때까지 절대 열지 마세요."},{"t":"dh","v":"기본 규칙"},{"t":"li","v":"초대장 카드는 다른 사람과 바꾸거나 버릴 수 없습니다."},{"t":"li","v":"카드를 누구에게 보여줄지는 자유입니다. **본인이 인간인 것을 모르지만, 인간임이 드러나지 않기 위해서는 문양이나 숫자를 적당히 숨기는 것도 방법입니다.**"},{"t":"li","v":"카드 숫자는 A를 1, J를 11, Q를 12, K를 13으로 셉니다."},{"t":"li","v":"말로 하는 거짓말은 허용됩니다. 카드를 조작하거나 남의 카드를 몰래 훔쳐보는 것은 금지입니다."},{"t":"li","v":"얻은 단서와 가문의 비밀을 다른 가문에 알려줄지 숨길지는 자유입니다."},{"t":"dh","v":"뱃삯 동전"},{"t":"p","v":"동전은 기억을 사는 돈이자, 마지막에 가문의 순위를 정하는 점수입니다. 동전을 쓰면 단서를 얻지만, 그만큼 순위는 내려갑니다."},{"t":"dh4","v":"얻는 방법"},{"t":"li","v":"입장할 때 1개"},{"t":"li","v":"**보물찾기**: 저승 곳곳에 동전이 숨겨져 있습니다. 찾은 동전은 찾은 사람의 것입니다."},{"t":"li","v":"**4문양 모임**: 스페이드, 하트, 클로버, 다이아를 한 명씩 모아 4명이 함께 붉은 토끼에게 방문하면 뱃삯 동전을 1개씩 받습니다. 단, 똑같은 카드로 두 번 동전을 받을 순 없습니다."},{"t":"li","v":"**회중시계**를 가장 먼저 손에 넣은 가문: 5개"},{"t":"li","v":"**자정의 재판**: 질문을 맞히면 가문에 동전을 받습니다. 질문은 그때 경계의 문 너머에서 공개됩니다."},{"t":"dh4","v":"쓰는 곳"},{"t":"li","v":"**망자의 기억** (2막): 동전 3개에 기억 하나"},{"t":"dh4","v":"주고받기"},{"t":"li","v":"동전은 가문에 상관없이 누구에게나 주거나 빌려줄 수 있습니다. 다른 가문과 동전을 모아 기억을 함께 사도 됩니다."},{"t":"li","v":"게임이 끝났을 때 동전은 **그 동전을 가진 사람의 가문**으로 셉니다. **동전이 가장 많은 가문에게는 붉은 토끼의 특별한 선물이 있습니다.**"},{"t":"dh","v":"단서를 얻는 방법"},{"t":"li","v":"**4문양 모임**: 네 문양이 모여 붉은 토끼를 찾아가면, 동전과 함께 찢어진 기억 한 조각을 들을 수 있습니다. 모임마다 다른 조각이 나옵니다."},{"t":"li","v":"**경계의 문 (1막)**: 네 가문의 열쇠 조각(QR)을 맞추면 열립니다. 문 너머의 문제를 풀면 되감기지 않은 기록이 나옵니다."},{"t":"li","v":"**백 년 전의 기록 (2막)**: 잘 찾아보니, 각 가문에는 **백 년 전 그 밤의 기록**이 남아 있었습니다. 경계의 문 너머에서는 자기 가문의 기록만 열립니다. 다른 가문의 기록이 궁금하다면, 화합을 제의해 보세요."},{"t":"li","v":"**망자의 기억 (2막)**: 망자에게 동전 3개를 내면 단어 하나를 알려 줍니다. 경계의 문 너머 \"백 년 전의 기록\" 장에서 \"망자의 기억을 구매하시겠습니까?\"를 누르고, 그 기억 칸에 단어를 적으면 기억이 열립니다."},{"t":"li","v":"**가문의 비밀**: 네 가문은 저마다 그 밤의 일을 하나씩 숨기고 있습니다. 대화와 화합으로 캐내 보세요."}],"phase":[{"t":"h","v":"페이즈 안내"},{"t":"dh4","v":"19:00 ~ 19:20  입장"},{"t":"p","v":"초대장 카드, 동전, 기억 봉투를 받고 자신의 가문을 확인하세요."},{"t":"dh4","v":"19:20 ~ 19:30  오프닝"},{"t":"p","v":"이승에 다시 할로윈이 찾아오고, 토끼굴을 지나 붉은 토끼가 다과회에 나타납니다. 오프닝이 끝나면 가문마다 경계의 문 열쇠 조각이 하나씩 전달됩니다."},{"t":"dh4","v":"19:30 ~ 20:20  1막 - 4문양 화합의 만찬"},{"t":"p","v":"**먼저 경계의 정원의 만찬을 마음껏 즐기십시오.** 배가 든든해지면 네 문양이 한자리에 모이는 화합의 모임을 가져 보시길 권합니다. 화합이 이루어지면 경계의 문이 열립니다. **문은 네 가문이 함께 열지만, 회중시계는 먼저 찾는 가문의 것입니다.**"},{"t":"dh4","v":"20:20 ~ 20:30  중간 이벤트 - 시간의 비밀"},{"t":"p","v":"되찾은 시계를 붉은 토끼가 살펴봅니다."},{"t":"dh4","v":"20:30 ~ 21:00  2막 - 오래된 기억을 모아"},{"t":"p","v":"붉은 토끼가 알려 주는 주문을 경계의 문에 외우면, 우리 가문에 남아 있던 \"백 년 전의 기록\"이 열립니다. 그리고 이때에만 강가의 망자들이 기억을 팝니다. 기록과 망자의 기억, 찢어진 기억, 가문의 비밀을 모아 백 년 전 그 밤의 진실을 추리하세요."},{"t":"p","v":"**망자에게 줄 뱃삯 동전이 부족하다면, 정원을 잘 살펴보세요.**"},{"t":"dh4","v":"21:00 ~ 21:20  자정의 재판과 결말"},{"t":"p","v":"붉은 토끼가 알려 주는 주문을 경계의 문에 외우면 자정의 재판 질문이 열립니다. 가문마다 합의한 답을 메모 한 장에 적어 붉은 토끼에게 제출합니다. 마지막 질문에 대한 답은 이야기의 결말을 바꿉니다. 이어서 모두 함께 기억 봉투를 열고, 백 년 전 그 밤의 진실과 가문 순위를 확인합니다."},{"t":"p","v":"토끼굴이 닫히기 전에 해내지 못하면, 이 하루는 또 백 년 동안 반복됩니다. 행운을 빕니다."}]}};

const norm = s => (s||'').normalize('NFC').toLowerCase().replace(/[\s.,!?'"“”‘’·:;\-~()]/g,'');
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(ch, input){

  let t = 0, alive = true;

  (function f(){ if(!alive) return; ctx.fillStyle = 'rgba(10,4,14,.22)'; ctx.fillRect(0,0,W,H);
    P = P.filter(p => p.l > 0); for(const p of P){ p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .985; p.l -= .012;
      ctx.globalAlpha = Math.max(p.l,0); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); }

// ---------- easter egg: the secret of time ----------
async function sha(t){ const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(h)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function openEgg(){
  if(document.querySelector('.modal,.curse')) return;
  const m = el('div','modal'); const bx = el('div','box');
  bx.append(el('h2', null, '시계가 속삭임을 기다린다'));
  bx.append(el('p', null, '세 단어를 속삭여라.'));
  const ins = [0,1,2].map(() => { const i = el('input'); i.autocomplete='off'; i.autocapitalize='off'; i.spellcheck=false; bx.append(i); return i; });
  const msg = el('div','msg'); const rb = el('div','rowb');
  const ok = el('button','btn','속삭이기'); const no = el('button','btn ghost','그만두기'); rb.append(no, ok); bx.append(msg, rb); m.append(bx);
  no.onclick = () => m.remove(); m.onclick = e => { if(e.target===m) m.remove(); };
  ok.onclick = async () => { const w = ins.map(i => i.value.normalize('NFC').toLowerCase().replace(/[^a-z]/g,'')).sort().join('|');
    if(await sha(w) === DATA.egg){ const ws = ins.map(i => i.value.trim()); m.remove(); curse(ws); }
    else { msg.className='msg'; msg.textContent='시계는 대답하지 않는다.'; bx.classList.remove('shake'); void bx.offsetWidth; bx.classList.add('shake'); } };
  document.body.append(m); ins[0].focus();
}
function curse(ws){
  const hh = $('#hh'), mh = $('#mh'); hh.style.transition = mh.style.transition = 'transform 4s cubic-bezier(.3,0,.2,1)';
  hh.style.transform = 'rotate(-1440deg)'; mh.style.transform = 'rotate(-4320deg)';
  try{ navigator.vibrate && navigator.vibrate([200,100,200,100,600]); }catch(e){}
  document.body.classList.add('cursed');
  const c = el('div','curse', `<div class="eye">🐇</div><h1>당신은<br>시간의 비밀을<br>알아내려 했다.</h1>
    <div class="s1">붉은 토끼가 당신의 이름을 기억했습니다.<br>오늘 밤, 털 한 올이 더 붉어질 것입니다.</div>
    <div class="s2">${ws.map(esc).join(' · ')}</div>`);
  const b = el('button','btn ghost','...아무것도 보지 못했습니다');
  b.onclick = () => { c.remove(); document.body.classList.remove('cursed');
    hh.style.transition = mh.style.transition = 'none'; hh.style.transform = 'rotate(-0.5deg)'; mh.style.transform = 'rotate(-6deg)';
    if(content.c8 || seen.c8) clockStrike(true); };
  c.append(b); document.body.append(c);
}
document.querySelector('header .clock').addEventListener('click', openEgg);

// ---------- ghost market: coins buy a word, the word opens the memory ----------
const SLOTS = [['g_cat1','체셔 고양이','기억 1'],['g_cat2','체셔 고양이','기억 2'],['g_cat3','체셔 고양이','기억 3'],['g_hat1','모자장수','기억 1'],['g_hat2','모자장수','기억 2'],['g_hat3','모자장수','기억 3']];
let gkeys = S.get('gkeys', {}); const gmem = {};
function ghostMarket(){
  const wrap = el('div','market');
  const open = el('button','btn','망자의 기억을 구매하시겠습니까?'); open.style.display = 'block'; open.style.margin = '14px auto 0';
  const slots = el('div','slots'); wrap.append(open, slots);
  const drawSlots = () => { slots.innerHTML = '';
    SLOTS.forEach(([id, who, n]) => {
      const c = el('div','slot'); c.append(el('h4', null, esc(who) + ' - ' + n));
      if(gmem[id]){ c.append(el('div','memo', `<b>${esc(gmem[id].title)}</b>${md(gmem[id].v)}`)); slots.append(c); return; }
      c.append(el('small', null, '<span style="color:var(--mute)">뱃삯 세 닢을 내고, 망자가 알려 준 단어를 적으십시오.</span>'));
      const row = el('div','answer'); const inp = el('input'); inp.placeholder = '망자가 알려 준 단어'; inp.autocomplete = 'off';
      const btn = el('button','btn','열기'); const msg = el('div','msg'); row.append(inp, btn); c.append(row, msg);
      const submit = async () => { const v = norm(inp.value); if(!v) return; if(fun(v)){ inp.value=''; return; } btn.innerHTML = '<span class="spin"></span>';
        const r = await tryOpen(id, v); btn.textContent = '열기';
        if(r){ gmem[id] = r; gkeys[id] = v; S.set('gkeys', gkeys); drawSlots(); }
        else { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); msg.className='msg'; msg.textContent='망자가 고개를 젓는다. 그런 단어는 들은 적 없다고.'; } };
      btn.onclick = submit; inp.onkeydown = e => { if(e.key==='Enter') submit(); };
      slots.append(c);
    }); };
  const show = () => { open.classList.add('hide'); drawSlots(); };
  open.onclick = show;
  if(Object.keys(gmem).length) show();
  return wrap;
}

function askHouse(conf, h){
  conf.innerHTML = '';
  const c = el('div','confirm', `<div class="bigs" style="color:${h.c==='red'?'var(--red2)':'#e8e0d4'}">${h.s}</div>
    <p style="margin:8px 0 4px"><b>${h.s} ${h.n} 가문</b><br>당신 가문의 인장을 입력하세요.</p>
    <small style="color:var(--mute)">인장은 가문 설정서에 적혀 있습니다.<br>한 번 정한 가문은 다시 바꿀 수 없습니다.</small>`);
  const row = el('div','answer'); const inp = el('input'); inp.placeholder = '가문의 인장'; inp.autocomplete = 'off';
  const btn = el('button','btn','새기기'); const msg = el('div','msg'); row.append(inp, btn); c.append(row, msg); conf.append(c);
  const fail = t => { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); msg.className='msg'; msg.textContent = t; };
  const submit = async () => {
    const v = norm(inp.value); if(!v) return; if(fun(v)){ inp.value=''; return; }
    btn.innerHTML = '<span class="spin"></span>';
    const d = await tryOpen('doc', v); btn.textContent = '새기기';
    if(!d) return fail('인장이 새겨지지 않는다. 문이 당신을 알아보지 못한다.');
    if(d.k !== h.k) return fail('이 인장은 ' + h.n + ' 가문의 것이 아니다.');
    house = h.k; content.house = d; S.set('house', h.k); S.set('hseal', v);
    msg.className='msg ok'; msg.textContent = h.s + ' ' + h.n + ' 가문의 인장이 새겨졌습니다. 문이 열립니다...'; setTimeout(() => go('c1'), 900);
  };
  btn.onclick = submit; inp.onkeydown = e => { if(e.key==='Enter') submit(); };
  c.scrollIntoView({behavior:'smooth', block:'center'}); setTimeout(() => inp.focus(), 400);
}
async function loadHouse(){ const hs = S.get('hseal', null); if(house && hs && !content.house){ const d = await tryOpen('doc', hs); if(d && d.k===house) content.house = d; } }

function render(){
  renderBadge(); renderNav();
  const v = $('#view'); v.innerHTML = '';

  if(actOf(cur)) panel.append(el('span','acttag', actOf(cur)));

  if(cur==='secret'){ const hn = HOUSES.find(x => x.k===house);
    renderBlocks(panel, [{t:'h', v: hn.s + ' ' + hn.n + ' 가문의 비밀'}, {t:'sub', v:'다른 가문에는 들키지 마십시오'},

// ---------- restore ----------
(async () => {
