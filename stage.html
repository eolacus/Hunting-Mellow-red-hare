<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>무대 - Hunting Mellow Red Hare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Song+Myung&family=Pinyon+Script&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0506; --ink:#eadfcd; --mute:#a8998a; --gold:#c9a45c; --gold2:#e6c98a; --red:#b31b2b; --red2:#e0414f; --line:rgba(201,164,92,.35)}
*{box-sizing:border-box}
html,body{margin:0; height:100%; overflow:hidden; background:radial-gradient(ellipse at 50% 35%, #2a0b10 0%, #120607 55%, #050203 100%); color:var(--ink); font-family:'Noto Serif KR',serif}
body{font-size:2.2vh}
/* backgrounds: the reference pictures, middle pressed nearly black so only their corners show */
#bg{position:fixed; inset:0; z-index:0; background-size:cover; background-position:center; opacity:0; transition:opacity 1.6s ease}
#bg.hallo{opacity:1; background-image:radial-gradient(ellipse 62% 70% at 50% 50%, rgba(8,4,3,.96) 30%, rgba(8,4,3,.66) 70%, rgba(8,4,3,.36) 100%), url('img/bg_hallo.jpg')}
#bg.wonder{opacity:1; background-image:radial-gradient(ellipse 62% 70% at 50% 50%, rgba(10,2,4,.97) 30%, rgba(10,2,4,.7) 70%, rgba(10,2,4,.4) 100%), url('img/bg_wonder.jpg')}
/* now and then the picture crackles like an old film: a short burst of static */
#noise{position:fixed; inset:0; width:100%; height:100%; z-index:4; pointer-events:none; opacity:0; mix-blend-mode:screen; image-rendering:pixelated}
#app{position:absolute; inset:0; z-index:1; display:grid; grid-template-rows:auto 1fr auto; padding:3vh 4vw}
header,footer{position:relative; z-index:3; text-shadow:0 0 1.2vh #000, 0 0 .4vh #000}
header{display:flex; align-items:center; justify-content:space-between; gap:2vw}
.brand{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:4.4vh; text-shadow:0 0 2vh rgba(201,164,92,.35)} .brand .r{color:var(--red2)}
.now{text-align:right; font-family:'Noto Serif KR',serif; color:var(--mute); font-size:2.2vh; letter-spacing:.3vh}
.now b{display:block; color:var(--gold2); font-size:4.2vh; letter-spacing:.5vh}
main{position:relative; display:flex; align-items:center; justify-content:center; min-height:0}
footer{display:flex; justify-content:space-between; align-items:flex-end; color:var(--mute); font-size:2vh; letter-spacing:.2vh}
footer .suits{color:var(--gold); letter-spacing:1.4vh; font-size:2.4vh} footer .suits .r{color:var(--red2)}
.next b{color:var(--gold2); font-family:'Noto Serif KR',serif; font-size:3vh; margin-left:1vw}
.scene{width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; animation:fade 1s ease both}
@keyframes fade{from{opacity:0; transform:translateY(1.5vh)} to{opacity:1; transform:none}}
.kicker{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:5vh}
h1{font-family:'Noto Serif KR',serif; font-weight:800; font-size:8vh; line-height:1.3; margin:1vh 0; letter-spacing:.6vh}
h1 .red{color:var(--red2)}
.sub{color:var(--mute); font-size:2.8vh; letter-spacing:.3vh}
.now b{font-family:'Cinzel',serif; font-weight:600; font-variant-numeric:tabular-nums}
.made{display:block; margin-top:.8vh; font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--gold); font-size:2.2vh; letter-spacing:.1vh; text-align:right}
/* clock ring (skeleton numerals, gears inside) */
.ring{display:block}
.watch .hand{transform-box:view-box; transform-origin:0 0; transition:transform 2.4s cubic-bezier(.6,0,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
/* waiting screen */
.lobby{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center}
.lobby .ring{position:absolute; left:50%; top:50%; height:178vh; width:178vh; transform:translate(-50%,-50%); filter:drop-shadow(0 0 3vh rgba(201,164,92,.25))}
.lobby .txt{position:relative; text-align:center; display:flex; flex-direction:column; align-items:center; text-shadow:0 0 1.2vh #000}
.lobby.cards .ring{height:92vh; width:92vh; overflow:visible}
.lobby.cards .t{font-size:8.4vh; line-height:1} .lobby.cards .ko{font-size:3.4vh} .lobby.cards .k{font-size:1.3vh} .lobby.cards .s2{font-size:1.9vh; max-width:44vh} .lobby.cards .env .t{font-size:7.4vh}
.lobby .k{font-family:'Cinzel',serif; color:var(--gold); letter-spacing:.5vh; font-size:1.7vh}
.lobby .t{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:11vh; line-height:1.05; margin:1vh 0 .5vh; text-shadow:0 0 4vh rgba(201,164,92,.4)}
.lobby .ko{font-family:'Song Myung',serif; font-size:5.6vh; letter-spacing:.6vh}
.lobby .s2{font-family:'Noto Serif KR',serif; color:var(--ink); font-size:2.6vh; line-height:1.8; letter-spacing:.1vh; margin-top:2.4vh}
.lobby .env .t{font-size:9vh}
/* phase title card: vintage dial style, ring bleeding off the right edge */
.card{position:relative; width:100%; height:100%}
.card .ring{position:absolute; right:-60vh; top:50%; height:149vh; width:149vh; transform:translateY(-50%); opacity:.95}
.card .txt{position:absolute; left:2vw; top:0; bottom:0; width:56vw; display:flex; flex-direction:column; justify-content:center; text-align:left; animation:fade 1.6s ease both}
.card .k{font-family:'Cinzel',serif; color:var(--gold); letter-spacing:.9vh; font-size:2.2vh}
.card .rule{width:22vh; height:1px; background:var(--gold); margin:3vh 0}
.card .t{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:19vh; line-height:.95; text-shadow:0 0 4vh rgba(201,164,92,.35)}
.card .ko{font-family:'Song Myung',serif; font-size:5.4vh; margin-top:3vh; letter-spacing:.3vh}
.card .ko small{display:block; font-family:'Noto Serif KR',serif; font-size:2.4vh; color:var(--mute); margin-top:1.6vh; letter-spacing:.1vh}
/* phase screens */
.act{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:13vh; line-height:1; text-shadow:0 0 3vh rgba(201,164,92,.35)}
.actko{font-family:'Song Myung',serif; font-size:4.2vh; letter-spacing:.4vh; margin-top:1vh}
.actko .red{color:var(--red2)}
/* opening */
.op{max-width:80vw; text-align:left; font-size:calc(var(--fs, 1) * 1em)}
.op h2{font-family:'Noto Serif KR',serif; text-align:center; color:var(--gold2); font-size:2.1em; margin:0 0 3vh; letter-spacing:.5vh}

.op p.pen{font-family:'Song Myung',cursive; color:#ff5b68; font-size:2.1em; line-height:1.35; text-indent:0; text-align:center; margin:2.2vh 0}
.op p.wel{font-family:'Noto Serif KR',serif; font-weight:800; text-align:center; text-indent:0; color:var(--gold2); font-size:1.6em}
.op p.clo{text-align:center; text-indent:0; color:var(--red2); font-weight:700}
.op .pg{text-align:center; color:var(--gold); letter-spacing:1vh; margin-top:2vh}
/* houses */
.houses{display:grid; grid-template-columns:repeat(4, 1fr); gap:2vw; width:100%; max-width:88vw; margin-top:3vh}
.hc{border-top:.3vh solid var(--gold); padding:2vh 1vw 1vh; background:linear-gradient(180deg, rgba(201,164,92,.10), transparent)}
.hc .s{font-size:6vh; line-height:1} .hc.red .s{color:var(--red2)}
.hc .n{font-family:'Noto Serif KR',serif; font-weight:800; font-size:2.8vh; margin:.5vh 0 1.4vh}
.bar{display:flex; align-items:center; gap:1vw; font-size:1.9vh; color:var(--mute); margin:.8vh 0; text-align:left}
.bar span{flex:0 0 9.5em} .bar i{flex:1; height:1vh; background:rgba(255,255,255,.08); border-radius:1vh; overflow:hidden; position:relative}
.bar i b{position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--red), var(--red2)); border-radius:1vh; transition:width 1s}
.bar em{flex:0 0 3em; font-style:normal; color:var(--ink); text-align:right}
/* event */
.spell{font-family:'Song Myung',cursive; color:#ff4d5e; font-size:15vh; line-height:1.1; margin:2vh 0; text-shadow:0 0 4vh rgba(255,40,60,.55); animation:breath 3s ease-in-out infinite}
@keyframes breath{50%{text-shadow:0 0 7vh rgba(255,40,60,.85)}}
.count{width:60vw; margin-top:2vh}
.count .bar span{flex-basis:auto} .count .bar i{height:1.6vh}
.count .lab{font-size:2.6vh; color:var(--gold2); margin-bottom:1vh}
/* act two: riverbank ghosts */
.river .whispers{position:absolute; inset:0; pointer-events:none; overflow:hidden}
.river .ws{position:absolute; max-width:34vw; font-family:'Noto Serif KR',serif; font-style:italic; font-size:2.1vh; line-height:1.6; color:rgba(220,205,190,.0); animation:whisper 9s ease-in-out forwards}
@keyframes whisper{0%{color:rgba(220,205,190,0); transform:translateX(-1vw); filter:blur(3px)} 25%,70%{color:rgba(220,205,190,.42); filter:blur(0)} 100%{color:rgba(220,205,190,0); transform:translateX(1.5vw); filter:blur(3px)}}
.ghosts2{display:flex; gap:22vw; margin-top:4vh; position:relative}
.gh2{position:relative; display:flex; flex-direction:column; align-items:center; width:24vw}
.gh2 svg{height:30vh; width:auto; overflow:visible; filter:drop-shadow(0 0 1.6vh rgba(170,210,235,.55)); animation:bob 5s ease-in-out infinite}
.gh2[data-g="hatter"] svg{animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-1.6vh)}}
.gh2 .mouth{transform-box:fill-box; transform-origin:center}
.gh2.talking .mouth{animation:talk .16s ease-in-out infinite alternate}
@keyframes talk{to{transform:scaleY(.35)}}
.gh2 .tail{transform-box:fill-box; transform-origin:0% 100%; animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{to{transform:rotate(8deg)}}
.gh2 .steam{animation:steam 3s ease-in-out infinite; opacity:.6} .gh2 .steam:nth-of-type(2){animation-delay:-1.5s}
@keyframes steam{50%{transform:translateY(-1.2vh); opacity:.15}}
.gh2 .gn{font-family:'Noto Serif KR',serif; font-weight:800; color:var(--gold2); font-size:2.6vh; margin-top:1.4vh}
.gh2 .gc{color:var(--mute); font-size:2vh} .gh2 .gc b{color:var(--red2); font-size:3vh}
.gh2 .bub{position:absolute; bottom:calc(100% + 1vh); left:50%; transform:translateX(-50%); width:30vw; padding:1.6vh 1.6vw; font-size:2.2vh; line-height:1.6; color:#eef5f8;
  background:rgba(14,22,28,.72); border:1px solid rgba(170,210,235,.45); border-radius:1.2vh; opacity:0; transition:opacity .6s}
.gh2 .bub::after{content:""; position:absolute; top:100%; left:50%; margin-left:-1vh; border:1vh solid transparent; border-top-color:rgba(170,210,235,.45)}
.gh2 .bub.on{opacity:1}
.gh2[data-g] .bub{bottom:auto; top:6vh; width:24vw; transform:none}
.gh2[data-g="cat"] .bub{left:calc(100% + 2vw)} .gh2[data-g="hatter"] .bub{left:auto; right:calc(100% + 2vw)}
.gh2[data-g] .bub::after{top:3vh; margin-left:0; border-top-color:transparent}
.gh2[data-g="cat"] .bub::after{left:auto; right:100%; border-right-color:rgba(170,210,235,.45)}
.gh2[data-g="hatter"] .bub::after{left:100%; border-left-color:rgba(170,210,235,.45)}
.remind{position:absolute; right:0; bottom:0; text-align:right; color:var(--mute); font-size:1.9vh}
.remind b{font-family:'Song Myung',cursive; color:#ff6b78; font-size:3.6vh; font-weight:400}
.ghosts{display:flex; gap:4vw; margin-top:4vh}
.gh{min-width:28vw; padding:2.4vh 2vw; border-top:1px solid var(--gold); border-bottom:1px solid var(--gold)}
.gh .gn{font-family:'Noto Serif KR',serif; font-weight:800; font-size:3.4vh; color:var(--gold2)}
.gh .gc{font-size:2.4vh; color:var(--mute); margin-top:1vh} .gh .gc b{color:var(--red2); font-size:4vh}
.final p{font-family:'Noto Serif KR',serif; font-size:2.6vh; text-wrap:balance; line-height:1.65; margin:1vh auto; max-width:82vw; opacity:0; animation:fade 2s ease forwards}
.final{position:relative} .final > *:not(.ring){position:relative; z-index:1; text-shadow:0 0 1vh #000}
.final .ring{position:absolute; left:50%; top:50%; height:178vh; width:178vh; transform:translate(-50%,-50%); opacity:.28; z-index:0}
.final .kicker{font-family:'Noto Serif KR',serif; font-weight:800; font-size:3.6vh; color:var(--red2); margin:1vh 0}
.final p.en{font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:8vh}
/* announcement */
.ann{position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; background:rgba(5,2,3,.9); animation:fade .6s ease both}
.ann div{max-width:76vw; text-align:center; padding:5vh 4vw; border-top:1px solid var(--gold); border-bottom:1px solid var(--gold)}
.ann small{display:block; font-family:'Pinyon Script',cursive; color:var(--gold2); font-size:4vh; margin-bottom:2vh}
.ann p{margin:0; font-family:'Noto Serif KR',serif; font-weight:800; font-size:5.4vh; line-height:1.6}
/* start + status */
.start{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:#050203}
.start button{font-family:'Noto Serif KR',serif; font-size:3vh; padding:2vh 5vw; background:var(--red); color:#fff; border:0; border-radius:.6vh; cursor:pointer}
.start p{color:var(--mute); text-align:center; font-size:2vh; margin-top:2vh}
.memory{max-width:80vw; font-size:calc(var(--fs, 1) * 1em)}
.memory p{font-size:1.5em; line-height:1.8; margin:0 0 1.2vh; font-style:italic; color:#efe2cc; opacity:0; animation:fade 2.2s ease forwards}
.murm p{max-width:72vw; margin:1.4vh auto; font-size:2.5vh; line-height:1.7; color:#cdbba6; font-style:italic; opacity:0; animation:fade 2s ease forwards}
.vq0{color:var(--mute); font-size:2.8vh; max-width:76vw; line-height:1.8}
.tally{display:flex; gap:4vw; margin:4vh 0 2vh}
.tally .t{width:26vw} .tally .t b{display:block; font-family:'Noto Serif KR',serif; font-size:3.4vh; margin-bottom:1vh}
.tally .t em{display:block; font-style:normal; font-size:9vh; line-height:1; color:var(--gold2); font-family:'Noto Serif KR',serif; font-weight:900}
.tally .t.no em{color:#9fb7c9}
.tally .t i{display:block; height:1.4vh; background:rgba(255,255,255,.08); border-radius:1vh; overflow:hidden; margin-top:1.4vh}
.tally .t i s{display:block; height:100%; background:linear-gradient(90deg, var(--red), var(--red2)); transition:width 1s}
.tally .t.no i s{background:linear-gradient(90deg, #3b5466, #8fb0c8)}
#floats{position:fixed; inset:0; pointer-events:none; z-index:5; overflow:hidden}
.float{position:absolute; bottom:-12vh; max-width:34vw; padding:1.4vh 1.6vw; font-size:2.4vh; line-height:1.6; color:#f1e6d4; background:rgba(20,8,10,.55); border-left:.3vh solid var(--gold); animation:floatUp 16s linear forwards}
.float small{display:block; color:var(--gold2); font-size:1.8vh; margin-top:.4vh}
@keyframes floatUp{0%{transform:translateY(0); opacity:0} 8%{opacity:1} 85%{opacity:1} 100%{transform:translateY(-105vh); opacity:0}}
#bigThought{min-height:30vh; display:flex; flex-direction:column; align-items:center; justify-content:center}
#bigThought p{font-family:'Noto Serif KR',serif; font-weight:700; font-size:6vh; line-height:1.5; max-width:76vw; margin:0; animation:fade 1.2s ease both}
#bigThought small{color:var(--gold2); font-size:2.6vh; margin-top:2vh; animation:fade 1.2s ease both}
.dot{position:fixed; left:1vw; bottom:1vh; width:1vh; height:1vh; border-radius:50%; background:#3b8f4a; opacity:.6}
.dot.off{background:#a33}
</style>

<body>
<div id="bg"></div>
<canvas id="noise" width="320" height="180"></canvas>
<div id="app">
  <header><div class="brand">Hunting Mellow <span class="r">Red</span> Hare</div><div class="now"><b id="clock">--:--</b><span id="phaseName"></span></div></header>
  <main id="main"></main>
  <footer><div class="suits">♠ <span class="r">♥</span> <span class="r">♦</span> ♣</div><div><div class="next" id="next"></div><span class="made">Made by 나나</span></div></footer>
</div>
<div id="floats"></div>
<div class="dot" id="dot"></div>
<audio id="a0" loop preload="auto"></audio><audio id="a1" loop preload="auto"></audio>
<script type="module">
import { connect, login, LOGIN_CSS, envelopeOn, ENVELOPE_MS, CARD_MS, openingCardStart, openingPageNow, publishKeys, PHASE_NAME, PHASE_CH, STORY_MIN, HOUSES, pIdx, atToday, autoAdvance, nextEntry, fmtClock, fmtLeft, esc, md } from './net.js';
document.head.append(Object.assign(document.createElement('style'), {textContent: LOGIN_CSS}));
const $ = s => document.querySelector(s);
const N = await connect();
await login(N, 'host', '무대 화면');

let st = {}, cfg = {}, players = {}, host = {}, npc = {}, votes = {}, thoughts = [], opening = [];
try{ opening = await (await fetch('opening.json')).json(); }catch(e){}

// ---------- start (a click is needed before the TV may play sound) ----------
const start = document.createElement('div'); start.className = 'start';
start.innerHTML = '<div><button>무대 시작</button><p>소리를 내려면 한 번 눌러 주세요. 전체 화면은 F11.</p></div>';
document.body.append(start);
await new Promise(r => start.querySelector('button').onclick = r);
start.remove(); try{ document.documentElement.requestFullscreen && await document.documentElement.requestFullscreen(); }catch(e){}
const AC = new (window.AudioContext || window.webkitAudioContext)();
N.presence('stage/online', true, false);

// ---------- clock ring: engraved gold line-art, no filled shapes ----------
const STILL = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
const turn = (sec, rev) => STILL ? '' : `<animateTransform attributeName="transform" type="rotate" from="0" to="${rev ? -360 : 360}" dur="${sec}s" repeatCount="indefinite"/>`;
const ROM = ['XII','I','II','III','IV','V','VI','VII','VIII','IX','X','XI'];
const GOLD = '#c9a45c', GOLD2 = '#ecd29a', INKD = '#0d0506';
let ringId = 0;
const f2 = v => v.toFixed(2);
function gearOutline(r, teeth, depth){
  const n = teeth * 4, pts = [];
  for(let i = 0; i < n; i++){ const a = i / n * Math.PI * 2, q = i % 4, rr = (q === 1 || q === 2) ? r : r - depth; pts.push(f2(rr * Math.cos(a)) + ' ' + f2(rr * Math.sin(a))); }
  return 'M' + pts.join('L') + 'Z';
}
// an open skeleton wheel: toothed rim, inner rim, spokes, hub - strokes only
function skelGear(cx, cy, r, teeth, sec, rev, w = .45){
  const spokes = Array.from({length: 5}, (_, k) => { const a = k / 5 * Math.PI * 2; return `<line x1="${f2(r*.18*Math.cos(a))}" y1="${f2(r*.18*Math.sin(a))}" x2="${f2(r*.72*Math.cos(a))}" y2="${f2(r*.72*Math.sin(a))}"/>`; }).join('');
  return `<g transform="translate(${cx} ${cy})"><g fill="none" stroke="${GOLD}" stroke-width="${w}">${turn(sec, rev)}
    <path d="${gearOutline(r, teeth, r * .12)}"/><circle r="${f2(r * .78)}"/><circle r="${f2(r * .72)}" stroke-width="${w * .6}"/>${spokes}<circle r="${f2(r * .18)}"/><circle r="${f2(r * .06)}" fill="${GOLD}"/></g></g>`;
}
// a small engraved sub-dial with its own numerals and hand
function subDial(cx, cy, r, sec, nums){
  const ticks = Array.from({length: 60}, (_, i) => `<line x1="0" y1="${f2(-r)}" x2="0" y2="${f2(-r + (i % 5 ? r*.06 : r*.13))}" transform="rotate(${i*6})"/>`).join('');
  const ns = nums.map((n, i) => `<text x="0" y="${f2(-r*.7)}" font-size="${f2(r*.2)}" transform="rotate(${i * 360 / nums.length})">${n}</text>`).join('');
  return `<g transform="translate(${cx} ${cy})" fill="none" stroke="${GOLD}" stroke-width=".3">
    <circle r="${r}" stroke-width=".55"/><circle r="${f2(r*.84)}"/>${ticks}
    <g fill="${GOLD}" stroke="none" font-family="Cinzel, serif" text-anchor="middle" dominant-baseline="middle">${ns}</g>
    <g>${turn(sec)}<line x1="0" y1="${f2(r*.15)}" x2="0" y2="${f2(-r*.62)}" stroke="${GOLD2}" stroke-width=".7"/></g><circle r="${f2(r*.07)}" fill="${GOLD2}"/></g>`;
}
// guilloche rosette: the engine-turned pattern of fine watch dials
function rosette(r, n, sec){
  return `<g fill="none" stroke="${GOLD}" stroke-width=".22" opacity=".75">${turn(sec)}${Array.from({length: n}, (_, k) => `<ellipse rx="${r}" ry="${f2(r*.36)}" transform="rotate(${f2(k * 180 / n)})"/>`).join('')}<circle r="${r}" stroke-width=".5"/></g>`;
}
function inscription(id, r, text, size, sec, rev){
  const len = f2(2 * Math.PI * r * .992);
  return `<g>${turn(sec, rev)}<path id="${id}" d="M0 ${-r} a${r} ${r} 0 1 1 -.01 0" fill="none"/><text font-family="Cinzel, serif" font-weight="600" font-size="${size}" fill="${GOLD}" dominant-baseline="middle"><textPath href="#${id}" textLength="${len}" lengthAdjust="spacing">${text}</textPath></text></g>`;
}
// an engraved wheel that hides what lies beneath it (dark fill, gold lines), so wheels can overlap the dial
function deepGear(cx, cy, r, teeth, sec, rev){

    <ellipse class="mouth" cx="65" cy="96" rx="6" ry="4" fill="rgba(10,6,8,.6)" stroke="#d6e9f2" stroke-width="1.3"/></svg>`,
};
const GHOST_LINES = {
  cat: ['후후, 길을 잃었니? 매일 같은 날을 사는 것도 모르고 말이야.', '뱃삯 세 닢이면... 내가 본 걸 보여주지.', '그 밤 일은 다 기억하고 있어. 공짜는 아니지만.'],
  hatter: ['차 한 잔 하시겠습니까? 백 년째 같은 차지만요.', '기억 한 잔에 은화 세 닢입니다.', '설탕은 몇 개 넣어 드릴까요?'],
};
const WHISPERS = ['심장에 미친 하트 녀석들이 손님 심장을 노린 거야.', '예법 타령만 하는 무덤지기들이 손님 하나 제때 못 돌려보냈잖아.',
  '장부 하나 못 맞추는 우편국이야말로 수상하지.', '차에 취해서 아무것도 못 본 건 누구더라?', '그 시계가 사라지는 바람에... 배가 백 년째 뜨질 않는군.', '저 망자들, 정말 그 밤을 본 걸까?'];
let ghostTurn = 0, whisperN = 0;
setInterval(() => {   // the two ghosts take turns talking
  const gs = document.querySelectorAll('.gh2'); if(gs.length < 2) return;
  gs.forEach(g => { g.classList.remove('talking'); g.querySelector('.bub').classList.remove('on'); });
  const g = gs[ghostTurn % 2], k = g.dataset.g, own = ((host.npc || {})[k] || {}).hello, lines = own ? [own.replace(/^"|"$/g, ''), ...GHOST_LINES[k].slice(1)] : GHOST_LINES[k];
  const b = g.querySelector('.bub'); b.textContent = lines[Math.floor(ghostTurn / 2) % lines.length];
  setTimeout(() => { b.classList.add('on'); g.classList.add('talking'); setTimeout(() => g.classList.remove('talking'), 2600); }, 400);
  ghostTurn++;
}, 6500);
setInterval(() => {   // house whispers drift through the background
  const box = document.querySelector('.river .whispers'); if(!box || box.children.length > 3) return;
  const w = document.createElement('div'); w.className = 'ws'; w.textContent = WHISPERS[whisperN++ % WHISPERS.length];
  const top = Math.random() < .5 ? 2 + Math.random() * 7 : 88 + Math.random() * 5;
  w.style.top = top + '%'; w.style.left = (3 + Math.random() * 60) + '%'; box.append(w); setTimeout(() => w.remove(), 9200);
}, 2800);

// ---------- scenes ----------
const members = () => Object.values(players).filter(p => p && p.house);
const has = (p, ch) => (p.opened || '').split(',').includes(ch);
function houseBars(chs){
  return `<div class="houses">${HOUSES.map(h => { const ps = members().filter(p => p.house === h.k);
    return `<div class="hc ${h.red ? 'red' : ''}"><div class="s">${h.s}</div><div class="n">${h.n} 가문 · ${ps.length}명</div>${chs.map(([ch, lab]) => {
      const n = ps.filter(p => has(p, ch)).length, pct = ps.length ? n / ps.length * 100 : 0;
      return `<div class="bar"><span>${lab}</span><i><b style="width:${pct}%"></b></i><em>${n}</em></div>`; }).join('')}</div>`; }).join('')}</div>`;
}
function eventScene(ch, kicker, title){
  const ms = members(), n = ms.filter(p => has(p, ch)).length, pct = ms.length ? n / ms.length * 100 : 0;
  return `<div class="scene"><div class="kicker">${kicker}</div><h1>${title}</h1><div class="sub">붉은 토끼의 주문을 각자의 화면에 적으십시오</div>
    <div class="spell">${esc((host.keys || {})[ch] || '')}</div>
    <div class="count"><div class="lab">주문을 외운 손님 ${n} / ${ms.length}</div><div class="bar"><i><b style="width:${pct}%"></b></i></div></div></div>`;
}
let scene = '', annT = null, dataVer = 0, rang = false, cardT = null;
function render(){
  const ph = st.phase || 'arrive';
  $('#phaseName').textContent = PHASE_NAME[ph] || '';
  $('#bg').className = ph === 'arrive' ? 'hallo' : (ph === 'end' || envelopeOn(st, N.now())) ? 'wonder' : '';
  document.querySelector('.now').style.visibility = ph === 'arrive' ? '' : 'hidden'; $('#next').style.display = 'none';
  let html = '', key = ph + '#' + dataVer;
  const ch = PHASE_CH[ph];
  const spellView = ch && (st.showSpell || members().filter(p => has(p, ch)).length < members().length || N.now() - (st.phaseAt || 0) < 4 * 60e3);
  if(ph === 'arrive'){
    html = `<div class="scene lobby big">${lobbyClock()}<div class="txt"><div class="k">ONE MINUTE TO MIDNIGHT · FOR A HUNDRED YEARS</div><div class="t">Tea at the Boundary</div><div class="ko">경계의 정원 만찬</div></div></div>`;
  } else if(envelopeOn(st, N.now())){
    html = `<div class="scene lobby cards">${envClock()}<div class="txt env"><div class="k">BEFORE THE STORY BEGINS</div><div class="t">Open your<br>Envelope</div><div class="ko">봉투를 열어 주십시오</div>
      <div class="s2">초대장 카드와 가문 설정서를 꺼내, 우리 가문의 설정서를 읽어 주십시오.<br>다른 가문에는 보여 주지 마십시오.</div></div></div>`;
    key += '|env'; clearTimeout(cardT); cardT = setTimeout(render, Math.max(1000, ENVELOPE_MS - (N.now() - (st.phaseAt || 0)) + 50));
  } else if(CARDS[ph] && N.now() >= cardStart() && N.now() - cardStart() < CARD_MS){
    const [k, t, ko, sm] = CARDS[ph];
    html = `<div class="scene card">${movement({ hands: true, speed: 48 })}<div class="txt"><div class="k">${k}</div><div class="rule"></div><div class="t">${t}</div><div class="ko">${ko}<small>${sm}</small></div></div></div>`;
    key += '|card'; clearTimeout(cardT); cardT = setTimeout(render, CARD_MS - (N.now() - cardStart()) + 50);
  } else if(ph === 'opening'){
    const i = Math.max(0, Math.min(opening.length - 1, openingPageNow(st, cfg, N.now()))), pg = opening[i]; key += i;
    clearTimeout(cardT); cardT = setTimeout(render, 1000);
    const cls = {b:'', p:'pen', w:'wel', c:'clo'};
    html = pg ? `<div class="scene"><div class="op"><h2>${esc(pg.title)}</h2>${pg.blocks.map(([k, v]) => `<p class="${cls[k]}">${md(v)}</p>`).join('')}<div class="pg">${opening.map((_, j) => j === i ? '♥' : '·').join(' ')}</div></div></div>` : '';
  } else if(ph === 'act1'){
    html = `<div class="scene"><div class="act">Act One</div><div class="actko">1막 · 4문양 화합의 만찬</div>
      ${houseBars([['c2','첫 번째 문 통과'],['c3','두 번째 문 통과'],['c4','시계가 잠든 자리']])}</div>`;
    key += '|' + JSON.stringify(members().map(p => [p.house, p.opened]));
  } else if(ph === 'end' && st.stageScene === 'memory'){
    html = `<div class="scene"><div class="kicker">The Guest Remembers</div><div class="memory">${(host.memory || []).map((l, i) => `<p style="animation-delay:${1 + i * 5.5}s">${poem(esc(l))}</p>`).join('')}</div></div>`;
    key += '|memory';
  } else if(ph === 'end' && st.stageScene === 'vote'){
    const vs = Object.values(votes), y = vs.filter(v => v.v === 'yes').length, n = vs.filter(v => v.v === 'no').length, tot = Math.max(1, y + n);
    const q = host.question || ['', ''];
    html = `<div class="scene"><div class="vq0">${poem(esc(q[0]))}</div><h1 style="font-size:7vh">${esc(q[1])}</h1>
      <div class="tally"><div class="t"><b>네</b><em>${y}</em><i><s style="width:${y / tot * 100}%"></s></i></div><div class="t no"><b>아니오</b><em>${n}</em><i><s style="width:${n / tot * 100}%"></s></i></div></div>
      <div class="sub">고른 손님 ${y + n} / ${members().length}</div></div>`;
    key += '|vote|' + y + '/' + n + '/' + members().length;
  } else if(ph === 'end' && st.stageScene === 'ending' && st.verdict && (host.endings || {})[st.verdict]){
    const E = host.endings[st.verdict], nar = E.lines.filter(l => l.startsWith('n:')).map(l => l.slice(2));
    html = `<div class="scene final">${movement({ hands: true, speed: 180 })}<div class="kicker" style="animation:fade 2s 3s both">${esc(E.title)}</div>${[...nar, ...E.finals].map((l, i, a) => `<p class="${i === a.length - 1 ? 'en' : ''}" style="animation-delay:${9 + i * 4}s">${poem(esc(l))}</p>`).join('')}</div>`;
    key += '|ending|' + st.verdict;
  } else if(ph === 'end' && st.stageScene === 'thoughts'){
    html = `<div class="scene"><div class="act" style="font-size:9vh">Your Thoughts</div><div class="actko">당신들의 생각</div><div id="bigThought"></div></div>`;
    key += '|thoughts';
  } else if(ph === 'mid'){
    html = `<div class="scene"><div class="act">Interlude</div><div class="actko">시간의 <span class="red">비밀</span></div><div class="murm">${(host.midmurmurs || []).map((l, i) => `<p style="animation-delay:${1.5 + i * 4}s">${esc(l)}</p>`).join('')}</div></div>`;
  } else if(ph === 'trial'){
    html = `<div class="scene"><div class="act">The Trial</div><div class="actko">자정의 <span class="red">재판</span></div><div class="murm">${(host.murmurs || []).map((l, i) => `<p style="animation-delay:${1.5 + i * 4}s">${esc(l)}</p>`).join('')}</div></div>`;
  } else if(ph === 'act2'){
    const sold = g => Object.values((npc[g] || {}).sales || {}).length;
    const gname = g => ((host.npc || {})[g] || {}).name || (g === 'cat' ? '체셔 고양이' : '모자장수');
    html = `<div class="scene river"><div class="whispers"></div><div class="act">Act Two</div><div class="actko">2막 · 오래된 기억을 모아</div><div class="sub">강가의 망자들이 기억을 팝니다 · 은화 세 닢</div>
      <div class="ghosts2">${['cat','hatter'].map(g => `<div class="gh2" data-g="${g}"><div class="bub"></div>${GHOST_SVG[g]}<div class="gn">${esc(gname(g))}</div><div class="gc">팔려 나간 기억 <b>${sold(g)}</b></div></div>`).join('')}</div></div>`;
    key += '|' + sold('cat') + '/' + sold('hatter');
  } else if(ph === 'party'){
    html = `<div class="scene"><h1 style="font-family:'Pinyon Script',cursive; font-weight:400; color:var(--gold2); font-size:15vh; margin-top:3vh">Happy Halloween</h1><div class="sub">백 년 만의 내일에 오신 것을 환영합니다</div></div>`;
  } else if(ph === 'end'){
    html = `<div class="scene"><div class="act">The Last Bell</div><div class="actko">자정의 <span class="red">종</span></div></div>`;
  } else {
    html = `<div class="scene"><div class="actko">${esc(PHASE_NAME[ph])}</div></div>`;
  }
  if(key !== scene){
    const sameShell = scene.split('|')[0].split('#')[0] === key.split('|')[0].split('#')[0] && $('.watch');
    scene = key; $('#main').innerHTML = html;
    const min = ph === 'end' ? 719 : STORY_MIN[ph];
    if($('.watch')){ const w = $('.watch'); w.querySelectorAll('.hand').forEach(h => h.style.transition = 'none');
      setWatch(sameShell || lastMin == null ? min : lastMin); requestAnimationFrame(() => { w.querySelectorAll('.hand').forEach(h => h.style.transition = ''); setWatch(min); }); }
    const op = $('.op'); if(op){ let f = 1.15; op.style.setProperty('--fs', f); while(f > .5 && op.scrollHeight > $('#main').clientHeight){ f -= .03; op.style.setProperty('--fs', f); } }
    const mem = $('.memory'); if(mem){ let f = 1.1; mem.style.setProperty('--fs', f); while(f > .5 && mem.scrollHeight > $('#main').clientHeight - 60){ f -= .04; mem.style.setProperty('--fs', f); } }
    if(ph === 'end' && st.stageScene === 'ending' && st.verdict){ if(!rang){ rang = true; setTimeout(() => { setWatch(720); bell(6, 2.4); }, 1200); } else setWatch(720); } else rang = false;
  }
  syncBgm();
}
function tick(){
  const now = N.now(), d = new Date(now); $('#clock').textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(v => String(v).padStart(2, '0')).join(':');
  const nx = nextEntry(cfg.schedule, now, st.phase);
  $('#next').innerHTML = nx ? `${esc(nx.label)}까지<b>${fmtLeft(nx.t - now)}</b>` : '';
}
let lastPhase = null;
N.on('state', v => { st = v || {}; if(lastPhase && st.phase !== lastPhase && PHASE_CH[st.phase]) bell(3); lastPhase = st.phase; render(); publishKeys(N, st, host.keys);
  const m = st.stageMsg; clearTimeout(annT); document.querySelectorAll('.ann').forEach(x => x.remove());
  if(m && m.text && N.now() - m.at < 20000){ const a = document.createElement('div'); a.className = 'ann'; a.innerHTML = `<div><small>From the Red Hare</small><p>${esc(m.text).replace(/\n/g, '<br>')}</p></div>`; document.body.append(a); annT = setTimeout(() => a.remove(), Math.max(1000, 20000 - (N.now() - m.at))); } });
N.on('config', v => { cfg = v || {}; render(); prefetchUploads(); });
N.on('players', v => { players = v || {}; render(); });
N.on('npc', v => { npc = v || {}; render(); });
N.on('votes', v => { votes = v || {}; render(); });
// thoughts: new ones float up first, then the old ones keep drifting by
const fresh = []; let seenT = 0, cyc = 0, big = 0;
N.on('thoughts', v => { const arr = Object.values(v || {}).filter(t => t && t.text).sort((a, b) => a.at - b.at); if(arr.length < seenT) seenT = 0; fresh.push(...arr.slice(seenT)); seenT = arr.length; thoughts = arr; });
const suitOf = k => (HOUSES.find(h => h.k === k) || {}).s || '';
setInterval(() => {
  const fl = $('#floats');
  if(!(st.phase === 'end' && st.stageScene === 'vote')){ fl.innerHTML = ''; return; }
  if(fl.children.length >= 6 || !thoughts.length) return;
  const t = fresh.shift() || thoughts[cyc++ % thoughts.length];
  const d = document.createElement('div'); d.className = 'float'; d.style.left = (4 + Math.random() * 62) + 'vw';
  d.innerHTML = `${esc(t.text)}<small>${suitOf(t.house)}</small>`; fl.append(d); setTimeout(() => d.remove(), 16500);
}, 2600);
setInterval(() => {
  const bt = $('#bigThought'); if(!bt || !thoughts.length) return;
  const t = thoughts[big++ % thoughts.length]; bt.innerHTML = `<p>"${esc(t.text)}"</p><small>${suitOf(t.house)}</small>`;
}, 6500);
N.on('hostdata', v => { host = Object.assign(host, v || {}); dataVer++; render(); publishKeys(N, st, host.keys); });
N.on('npcdata', v => { host.npc = v || {}; dataVer++; render(); });
N.on('.info/connected', v => $('#dot').classList.toggle('off', v === false));
autoAdvance(N, () => st, () => cfg);
setInterval(tick, 500); tick();
// ---------- static: a burst of grain and torn scanlines every 8-20 seconds ----------
(() => {
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#noise'), cx = cv.getContext('2d'), W = cv.width, H = cv.height, img = cx.createImageData(W, H), app = $('#app');
  function frame(strength){
    const d = img.data;
    for(let i = 0; i < d.length; i += 4){ const v = Math.random() * 255 * strength; d[i] = v; d[i + 1] = v * .92; d[i + 2] = v * .85; d[i + 3] = 255; }
    cx.putImageData(img, 0, 0);
    for(let k = 0; k < 3; k++){ const y = Math.random() * H, h = 1 + Math.random() * 3; cx.fillStyle = `rgba(255,240,220,${.25 + Math.random() * .35})`; cx.fillRect(0, y, W, h); }
  }
  function burst(){
    const len = 160 + Math.random() * 380, t0 = performance.now(), strength = .55 + Math.random() * .45;
    const step = now => {
      const k = (now - t0) / len;
      if(k >= 1){ cv.style.opacity = 0; app.style.transform = ''; setTimeout(burst, 8000 + Math.random() * 12000); return; }
      frame(strength); cv.style.opacity = (.14 + Math.random() * .14) * (1 - k * .5);
      app.style.transform = Math.random() < .35 ? `translateX(${(Math.random() - .5) * 6}px)` : '';
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  setTimeout(burst, 6000);
})();
setInterval(render, 15000);
</script>
